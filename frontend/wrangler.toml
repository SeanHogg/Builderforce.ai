name = "builderforce-frontend"
main = ".vercel/output/static/_worker.js/index.js"
compatibility_date = "2026-03-07"
compatibility_flags = ["nodejs_compat"]

# next-on-pages builds middleware/functions as separate modules under __next-on-pages-dist__.
# They must be uploaded with the worker; use no-bundle + find_additional_modules.
find_additional_modules = true
base_dir = ".vercel/output/static/_worker.js"
rules = [
  { type = "ESModule", globs = ["**/*.js"] },
]

[assets]
directory = ".vercel/output/static"
binding = "ASSETS"
# `/` must reach the Worker. With the assets binding, a request whose path has a
# matching static file is answered by the asset layer and the Worker script is
# NEVER invoked — and `/` is prerendered to `index.html`. That silently killed
# the only path `studioHostRedirect` handles: `studio.builderforce.ai/` served
# the marketing home page instead of redirecting to `/studio`, because the
# middleware that decides never ran. Proven in production on 2026-10-03:
# `/dashboard` came back with `x-middleware-set-cookie: NEXT_LOCALE=…` and `/`
# came back with no `Set-Cookie` at all.
#
# Scoped to the ONE path rather than `true`: `true` routes every request —
# including every `_next/static/*` asset — through the Worker, which is a
# per-asset invocation bill for a decision only the root needs. The cost here is
# one invocation per home-page view, which also makes first-visit locale
# detection (`ensureLocaleCookie`) work on `/`, where it had been dead for the
# same reason.
run_worker_first = ["/"]

[[routes]]
pattern = "builderforce.ai"
custom_domain = true

[[routes]]
pattern = "www.builderforce.ai"
custom_domain = true

# The Studio app (standalone IDE), served by this same app under /studio; the
# middleware sends the host's root there. A ZONE route, not a custom domain: the
# api worker's greedy `*.builderforce.ai/*` zone route would otherwise take the
# host (a Custom Domain does not reliably beat it), and a more specific zone
# pattern does. DNS is already covered by the proxied wildcard record the api's
# site hosting needs. `studio` is a reserved site label (siteHosting.ts), so no
# user site can claim it.
[[routes]]
pattern = "studio.builderforce.ai/*"
zone_name = "builderforce.ai"

# Spawn, the Roblox game builder, under /spawn — the same zone-route pattern and
# reasoning as Studio above (`lib/productHosts.ts` sends the host's root there).
# `spawn` is a reserved site label (siteHosting.ts).
[[routes]]
pattern = "spawn.builderforce.ai/*"
zone_name = "builderforce.ai"

[observability.logs]
enabled = true
invocation_logs = true
