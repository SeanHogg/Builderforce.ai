name = "builderforce-frontend"
main = ".vercel/output/static/_worker.js/index.js"
compatibility_date = "2026-03-07"
compatibility_flags = ["nodejs_compat"]

# next-on-pages builds middleware/functions as separate modules under __next-on-pages-dist__.
# They must be uploaded with the worker; use no-bundle + find_additional_modules.
find_additional_modules = true
base_dir = ".vercel/output/static/_worker.js"
rules = [
  { type = "ESModule", globs = ["**/*.js"] },
]

[assets]
directory = ".vercel/output/static"
binding = "ASSETS"

[[routes]]
pattern = "builderforce.ai"
custom_domain = true

[[routes]]
pattern = "www.builderforce.ai"
custom_domain = true

# The Studio app (standalone IDE), served by this same app under /studio; the
# middleware sends the host's root there. A ZONE route, not a custom domain: the
# api worker's greedy `*.builderforce.ai/*` zone route would otherwise take the
# host (a Custom Domain does not reliably beat it), and a more specific zone
# pattern does. DNS is already covered by the proxied wildcard record the api's
# site hosting needs. `studio` is a reserved site label (siteHosting.ts), so no
# user site can claim it.
[[routes]]
pattern = "studio.builderforce.ai/*"
zone_name = "builderforce.ai"

[observability.logs]
enabled = true
invocation_logs = true
