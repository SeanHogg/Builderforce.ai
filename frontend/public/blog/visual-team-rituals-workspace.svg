<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">A visual human-and-agent stand-up</title><desc id="d">A stand-up frame contains participant objects, progress, blockers, a timer, comments, and connected follow-up tasks.</desc><rect width="1600" height="900" fill="#090b20"/><g font-family="Segoe UI,Arial,sans-serif"><text x="58" y="68" fill="#a98bff" font-size="18" font-weight="800" letter-spacing="3">VISUAL TEAM RITUAL</text><text x="58" y="116" fill="#fff" font-size="40" font-weight="800">Progress, blockers, and follow-ups stay attached to the work</text><rect x="58" y="158" width="1484" height="680" rx="24" fill="#0d1129" stroke="#3c4675" stroke-width="2"/><rect x="92" y="194" width="1000" height="596" rx="22" fill="#121638" stroke="#8b6cff" stroke-width="3"/><text x="124" y="236" fill="#b49aff" font-size="14" font-weight="800">FRAME · TEAM STAND-UP · LIVE</text><rect x="890" y="210" width="160" height="36" rx="18" fill="#312617"/><text x="970" y="234" text-anchor="middle" fill="#ffcf75" font-size="14" font-weight="800">◷ 04:32</text><g><rect x="124" y="278" width="276" height="136" rx="16" fill="#1a1b48" stroke="#8b6cff"/><circle cx="162" cy="320" r="18" fill="#a98bff"/><text x="194" y="316" fill="#fff" font-size="19" font-weight="800">Maya Chen</text><text x="194" y="340" fill="#b9c0d8" font-size="13">Product Manager · HUMAN</text><text x="148" y="380" fill="#fff" font-size="14">Focus: approve onboarding v3</text><rect x="124" y="436" width="276" height="136" rx="16" fill="#142747" stroke="#43cfff"/><circle cx="162" cy="478" r="18" fill="#4bdcff"/><text x="194" y="474" fill="#fff" font-size="19" font-weight="800">Delivery Agent</text><text x="194" y="498" fill="#b9c0d8" font-size="13">Implementation · AI AGENT</text><text x="148" y="538" fill="#fff" font-size="14">Focus: responsive card grid</text><rect x="430" y="278" width="276" height="136" rx="16" fill="#1a1b48" stroke="#8b6cff"/><circle cx="468" cy="320" r="18" fill="#a98bff"/><text x="500" y="316" fill="#fff" font-size="19" font-weight="800">Jon Bell</text><text x="500" y="340" fill="#b9c0d8" font-size="13">Engineer · HUMAN</text><text x="454" y="380" fill="#fff" font-size="14">Focus: accessibility tests</text><rect x="430" y="436" width="276" height="136" rx="16" fill="#142747" stroke="#43cfff"/><circle cx="468" cy="478" r="18" fill="#4bdcff"/><text x="500" y="474" fill="#fff" font-size="19" font-weight="800">Validator Agent</text><text x="500" y="498" fill="#b9c0d8" font-size="13">Quality · AI AGENT</text><text x="454" y="538" fill="#fff" font-size="14">Focus: proof of Done</text></g><rect x="740" y="278" width="310" height="294" rx="16" fill="#312617" stroke="#ffca69"/><text x="768" y="318" fill="#ffcf75" font-size="16" font-weight="800">BLOCKERS</text><rect x="768" y="342" width="254" height="72" rx="10" fill="#3c2d1c"/><text x="790" y="372" fill="#fff" font-size="14">Mobile grid overflows</text><text x="790" y="395" fill="#d5c5a6" font-size="12">↗ Diagnostics object</text><rect x="768" y="430" width="254" height="72" rx="10" fill="#3c2d1c"/><text x="790" y="460" fill="#fff" font-size="14">Keyboard label missing</text><text x="790" y="483" fill="#d5c5a6" font-size="12">↗ Editor selection</text><rect x="124" y="616" width="926" height="128" rx="16" fill="#151a3b"/><text x="150" y="652" fill="#9ca7ca" font-size="13" font-weight="800">OBJECT COMMENT · @MAYA</text><text x="150" y="684" fill="#fff" font-size="15">Ship only after Validator records a passing mobile and keyboard review.</text><text x="150" y="715" fill="#72f4c6" font-size="13">Resolved by accepted follow-up tasks</text>
<rect x="1132" y="194" width="374" height="596" rx="22" fill="#141735"/><text x="1162" y="236" fill="#fff" font-size="22" font-weight="800">Follow-up work</text><g><rect x="1162" y="278" width="314" height="112" rx="14" fill="#202550"/><text x="1188" y="312" fill="#fff" font-size="17" font-weight="800">Fix mobile overflow</text><text x="1188" y="340" fill="#b9c0d8" font-size="13">Delivery Agent · In progress</text><rect x="1188" y="356" width="120" height="20" rx="10" fill="#164c66"/><text x="1248" y="371" text-anchor="middle" fill="#58ddff" font-size="11">TASK</text><rect x="1162" y="412" width="314" height="112" rx="14" fill="#202550"/><text x="1188" y="446" fill="#fff" font-size="17" font-weight="800">Add accessible label</text><text x="1188" y="474" fill="#b9c0d8" font-size="13">Jon Bell · Ready</text><rect x="1188" y="490" width="120" height="20" rx="10" fill="#34286d"/><text x="1248" y="505" text-anchor="middle" fill="#c9baff" font-size="11">TASK</text><rect x="1162" y="546" width="314" height="112" rx="14" fill="#16342d" stroke="#61e8b8"/><text x="1188" y="580" fill="#fff" font-size="17" font-weight="800">Validate proof of Done</text><text x="1188" y="608" fill="#bce8d9" font-size="13">Validator Agent · Gated</text><rect x="1188" y="624" width="140" height="20" rx="10" fill="#205c49"/><text x="1258" y="639" text-anchor="middle" fill="#72f4c6" font-size="11">APPROVAL POLICY</text></g><rect x="1162" y="690" width="314" height="48" rx="10" fill="#6d52ed"/><text x="1319" y="720" text-anchor="middle" fill="#fff" font-size="15" font-weight="800">Start live stand-up</text></g></svg>
