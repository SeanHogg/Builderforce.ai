<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="t d"><title id="t">Creation Object registry contract</title><desc id="d">One registry entry supplies metadata to the palette, renderer, inspector, Brain, policy, and both client surfaces.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7581ad"/></marker></defs><rect width="1600" height="720" fill="#0a0c21"/><g font-family="Segoe UI,Arial,sans-serif"><text x="70" y="78" fill="#a98bff" font-size="18" font-weight="800" letter-spacing="3">REGISTRY-DRIVEN EXTENSIBILITY</text><text x="70" y="126" fill="#fff" font-size="38" font-weight="800">Register once; participate everywhere</text><rect x="70" y="206" width="420" height="380" rx="24" fill="#17163f" stroke="#8b6cff" stroke-width="2"/><text x="104" y="252" fill="#b49aff" font-size="19" font-weight="800">CREATION OBJECT DEFINITION</text><g fill="#242154"><rect x="104" y="282" width="352" height="46" rx="9"/><rect x="104" y="338" width="352" height="46" rx="9"/><rect x="104" y="394" width="352" height="46" rx="9"/><rect x="104" y="450" width="352" height="46" rx="9"/><rect x="104" y="506" width="352" height="46" rx="9"/></g><g fill="#fff" font-size="15"><text x="126" y="311">kind · label · icon · group</text><text x="126" y="367">default data · capability</text><text x="126" y="423">actions · mutable fields</text><text x="126" y="479">allowed connection kinds</text><text x="126" y="535">context + preview adapters</text></g><g><rect x="610" y="190" width="340" height="118" rx="18" fill="#13213f" stroke="#43cfff"/><text x="638" y="230" fill="#58ddff" font-size="17" font-weight="800">PRODUCT UI</text><text x="638" y="264" fill="#fff" font-size="15">Palette · Renderer · Inspector</text><rect x="610" y="332" width="340" height="118" rx="18" fill="#312617" stroke="#ffca69"/><text x="638" y="372" fill="#ffcf75" font-size="17" font-weight="800">BRAIN + SAFETY</text><text x="638" y="406" fill="#fff" font-size="15">Snapshot · allowlist · filter · proposal</text><rect x="610" y="474" width="340" height="118" rx="18" fill="#15342d" stroke="#61e8b8"/><text x="638" y="514" fill="#72f4c6" font-size="17" font-weight="800">POLICY + TEMPLATES</text><text x="638" y="548" fill="#fff" font-size="15">Capabilities · actions · registered kinds</text><rect x="1080" y="214" width="450" height="160" rx="22" fill="#13213f" stroke="#43cfff" stroke-width="2"/><text x="1112" y="260" fill="#58ddff" font-size="19" font-weight="800">WEB CREATION CANVAS</text><text x="1112" y="304" fill="#fff" font-size="15">same object identity</text><text x="1112" y="336" fill="#fff" font-size="15">revisioned graph commands</text><rect x="1080" y="424" width="450" height="160" rx="22" fill="#17163f" stroke="#8b6cff" stroke-width="2"/><text x="1112" y="470" fill="#b49aff" font-size="19" font-weight="800">VS CODE EDITOR TAB</text><text x="1112" y="514" fill="#fff" font-size="15">same object identity</text><text x="1112" y="546" fill="#fff" font-size="15">native editor context</text></g><g stroke="#7581ad" stroke-width="4" marker-end="url(#a)"><path d="M490 396H610"/><path d="M950 249H1080"/><path d="M950 533H1080"/></g><text x="1015" y="233" text-anchor="middle" fill="#9aa5c5" font-size="12" font-weight="800">SHARED CONTRACT</text><text x="1015" y="517" text-anchor="middle" fill="#9aa5c5" font-size="12" font-weight="800">SHARED CONTRACT</text></g></svg>
