<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="t d"><title id="t">Local exploration and durable action boundary</title><desc id="d">Authoring stays local; operational actions cross an explicit account gate and claim the unchanged session.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7581ad"/></marker></defs><rect width="1600" height="720" fill="#0a0c21"/><g font-family="Segoe UI,Arial,sans-serif"><text x="70" y="78" fill="#a98bff" font-size="18" font-weight="800" letter-spacing="3">ACTION BOUNDARY</text><text x="70" y="126" fill="#fff" font-size="38" font-weight="800">Explore freely. Authenticate when the work needs infrastructure.</text><g fill="#141837" stroke-width="2"><rect x="70" y="200" width="390" height="390" rx="24" stroke="#8b6cff"/><rect x="605" y="200" width="390" height="390" rx="24" stroke="#ffca69"/><rect x="1140" y="200" width="390" height="390" rx="24" stroke="#61e8b8"/></g><text x="106" y="248" fill="#b49aff" font-size="22" font-weight="800">LOCAL SESSION</text><g fill="#fff" font-size="16"><text x="106" y="300">✓ author objects</text><text x="106" y="338">✓ arrange + connect</text><text x="106" y="376">✓ ask scoped Brain</text><text x="106" y="414">✓ review proposals</text><text x="106" y="452">✓ save on this device</text></g><text x="106" y="530" fill="#9da7c8" font-size="14">No Project or tenant required</text><text x="641" y="248" fill="#ffcf75" font-size="22" font-weight="800">ACCOUNT GATE</text><g fill="#fff" font-size="15"><text x="641" y="294">publish · deliver · assign</text><text x="641" y="330">authenticate · execute</text><text x="641" y="366">record · generate · train</text><text x="641" y="402">compare · start stand-up</text></g><rect x="641" y="452" width="318" height="58" rx="12" fill="#322719"/><text x="800" y="478" text-anchor="middle" fill="#fff" font-size="14">Canvas remains unchanged</text><text x="800" y="499" text-anchor="middle" fill="#ffcf75" font-size="12">requiresAccount: true</text><text x="1176" y="248" fill="#72f4c6" font-size="22" font-weight="800">CLAIMED WORKSPACE</text><g fill="#fff" font-size="16"><text x="1176" y="300">✓ same object graph</text><text x="1176" y="338">✓ roles + permissions</text><text x="1176" y="376">✓ shared history</text><text x="1176" y="414">✓ canonical resources</text><text x="1176" y="452">✓ governed execution</text></g><text x="1176" y="530" fill="#9da7c8" font-size="14">Project remains optional</text><path d="M460 395H605M995 395H1140" stroke="#7581ad" stroke-width="4" marker-end="url(#a)"/><text x="532" y="378" text-anchor="middle" fill="#9da7c8" font-size="13">DURABLE ACTION</text><text x="1068" y="378" text-anchor="middle" fill="#9da7c8" font-size="13">CLAIM SESSION</text></g></svg>
