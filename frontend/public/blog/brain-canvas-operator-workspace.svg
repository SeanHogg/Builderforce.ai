<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Brain operating a selected Creation Canvas frame</title><desc id="d">The interface shows scope controls, live objects, typed relationships, the Brain composer, and a selectable proposal review drawer.</desc><rect width="1600" height="900" fill="#090b20"/><g font-family="Segoe UI,Arial,sans-serif"><text x="58" y="68" fill="#a98bff" font-size="18" font-weight="800" letter-spacing="3">BRAIN CANVAS OPERATOR</text><text x="58" y="116" fill="#fff" font-size="40" font-weight="800">Scope, propose, review, apply</text><rect x="58" y="158" width="1484" height="680" rx="24" fill="#0e122b" stroke="#3b4474" stroke-width="2"/><rect x="58" y="158" width="1484" height="64" rx="24" fill="#151a3d"/><text x="90" y="198" fill="#fff" font-size="19" font-weight="700">Launch review</text><text x="862" y="198" fill="#9ca7ca" font-size="13">BRAIN SCOPE</text><g><rect x="956" y="174" width="90" height="32" rx="16" fill="#252a4e"/><text x="1001" y="195" text-anchor="middle" fill="#b7bfd8" font-size="13">Canvas</text><rect x="1052" y="174" width="90" height="32" rx="16" fill="#252a4e"/><text x="1097" y="195" text-anchor="middle" fill="#b7bfd8" font-size="13">Selection</text><rect x="1148" y="174" width="90" height="32" rx="16" fill="#6d52ed"/><text x="1193" y="195" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">Frame</text></g><rect x="84" y="248" width="920" height="456" rx="18" fill="#0a0e24"/><rect x="116" y="280" width="846" height="368" rx="20" fill="#111637" stroke="#8b6cff" stroke-width="3" stroke-dasharray="10 7"/><text x="138" y="316" fill="#b49aff" font-size="14" font-weight="800">FRAME · CAMPAIGN DECISION</text><g><rect x="158" y="354" width="216" height="112" rx="14" fill="#1b1b4b" stroke="#8b6cff"/><text x="184" y="390" fill="#fff" font-size="19" font-weight="800">Customer evidence</text><text x="184" y="421" fill="#adb5d1" font-size="14">Dataset · 320 rows</text><rect x="442" y="354" width="216" height="112" rx="14" fill="#132947" stroke="#43cfff"/><text x="468" y="390" fill="#fff" font-size="19" font-weight="800">Landing page</text><text x="468" y="421" fill="#adb5d1" font-size="14">Website · Draft</text><rect x="726" y="354" width="196" height="112" rx="14" fill="#312617" stroke="#ffca69"/><text x="752" y="390" fill="#fff" font-size="19" font-weight="800">Evaluation</text><text x="752" y="421" fill="#d7c7a4" font-size="14">2 evidence gaps</text></g><path d="M374 410H442M658 410H726" stroke="#7180ad" stroke-width="3"/><text x="408" y="397" text-anchor="middle" fill="#8e9abd" font-size="11">DATA</text><text x="692" y="397" text-anchor="middle" fill="#8e9abd" font-size="11">REFERENCE</text><rect x="158" y="516" width="764" height="86" rx="15" fill="#161b3d"/><text x="184" y="550" fill="#9ca7ca" font-size="13" font-weight="700">BRAIN</text><text x="184" y="578" fill="#fff" font-size="16">“Evaluate this frame, add the missing KPI, and connect its source.”</text>
<rect x="1030" y="248" width="484" height="456" rx="18" fill="#141735" stroke="#4b5583"/><text x="1060" y="290" fill="#fff" font-size="22" font-weight="800">Review 5 proposed changes</text><g font-size="15"><rect x="1060" y="320" width="424" height="54" rx="10" fill="#202550"/><text x="1082" y="353" fill="#fff">☑ Add KPI “Conversion target”</text><rect x="1060" y="384" width="424" height="54" rx="10" fill="#202550"/><text x="1082" y="417" fill="#fff">☑ Update Evaluation.gaps</text><rect x="1060" y="448" width="424" height="54" rx="10" fill="#202550"/><text x="1082" y="481" fill="#fff">☑ Arrange KPI inside frame</text><rect x="1060" y="512" width="424" height="54" rx="10" fill="#202550"/><text x="1082" y="545" fill="#fff">☑ Connect Dataset → KPI · data</text><rect x="1060" y="576" width="424" height="54" rx="10" fill="#302619"/><text x="1082" y="609" fill="#ffcf75">☐ Invoke Website · publish</text></g><rect x="1260" y="646" width="224" height="42" rx="10" fill="#6d52ed"/><text x="1372" y="673" text-anchor="middle" fill="#fff" font-size="15" font-weight="800">Apply 4 selected</text><rect x="84" y="728" width="1430" height="82" rx="16" fill="#141735"/><text x="110" y="759" fill="#9ca7ca" font-size="12" font-weight="700">SUPPORTED CHANGE TYPES</text><text x="110" y="786" fill="#d2d6e7" font-size="15">object.add · object.update · object.delete · object.layout · connection.add · connection.update · connection.delete · object.action</text></g></svg>
