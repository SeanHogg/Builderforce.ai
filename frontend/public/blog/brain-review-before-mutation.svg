<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="t d"><title id="t">Brain review-before-mutation contract</title><desc id="d">A scoped snapshot passes through object contracts and safety filters into a proposal buffer and selected application.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7581ad"/></marker></defs><rect width="1600" height="720" fill="#0a0c21"/><g font-family="Segoe UI,Arial,sans-serif"><text x="70" y="78" fill="#a98bff" font-size="18" font-weight="800" letter-spacing="3">REVIEW BEFORE MUTATION</text><text x="70" y="126" fill="#fff" font-size="38" font-weight="800">Brain can operate because every step has a contract</text><g><rect x="70" y="230" width="260" height="270" rx="22" fill="#17163f" stroke="#8b6cff" stroke-width="2"/><text x="100" y="275" fill="#fff" font-size="21" font-weight="800">1 · Scope</text><text x="100" y="318" fill="#c8cde1" font-size="16">Canvas</text><text x="100" y="356" fill="#c8cde1" font-size="16">Selection</text><text x="100" y="394" fill="#b49aff" font-size="16" font-weight="800">Frame</text><text x="100" y="456" fill="#8f9abc" font-size="13">objects + typed edges</text><rect x="390" y="190" width="300" height="350" rx="22" fill="#13213f" stroke="#43cfff" stroke-width="2"/><text x="420" y="235" fill="#fff" font-size="21" font-weight="800">2 · Registry contract</text><text x="420" y="278" fill="#fff" font-size="15">declared actions</text><text x="420" y="312" fill="#fff" font-size="15">mutable-field allowlist</text><text x="420" y="346" fill="#fff" font-size="15">safe context adapter</text><text x="420" y="380" fill="#fff" font-size="15">layout bounds</text><rect x="420" y="416" width="240" height="76" rx="10" fill="#302619"/><text x="540" y="447" text-anchor="middle" fill="#ffcf75" font-size="13" font-weight="700">FILTERED</text><text x="540" y="470" text-anchor="middle" fill="#d8c8aa" font-size="12">secrets · tokens · credentials</text><rect x="750" y="190" width="360" height="350" rx="22" fill="#17163f" stroke="#8b6cff" stroke-width="2"/><text x="780" y="235" fill="#fff" font-size="21" font-weight="800">3 · Proposal buffer</text><g fill="#242154"><rect x="780" y="270" width="300" height="44" rx="8"/><rect x="780" y="324" width="300" height="44" rx="8"/><rect x="780" y="378" width="300" height="44" rx="8"/><rect x="780" y="432" width="300" height="44" rx="8"/></g><g fill="#fff" font-size="14"><text x="800" y="298">☑ object.add / update</text><text x="800" y="352">☑ object.layout</text><text x="800" y="406">☑ connection.add / update</text><text x="800" y="460">☐ object.action</text></g><rect x="1170" y="230" width="360" height="270" rx="22" fill="#15342d" stroke="#61e8b8" stroke-width="2"/><text x="1200" y="275" fill="#fff" font-size="21" font-weight="800">4 · Apply selected</text><text x="1200" y="322" fill="#fff" font-size="15">canvas state changes</text><text x="1200" y="358" fill="#fff" font-size="15">operational actions queue</text><text x="1200" y="394" fill="#fff" font-size="15">activity stays attributable</text><text x="1200" y="454" fill="#72f4c6" font-size="14" font-weight="800">USER CHOOSES THE SET</text></g><g stroke="#7581ad" stroke-width="4" marker-end="url(#a)"><path d="M330 365H390"/><path d="M690 365H750"/><path d="M1110 365H1170"/></g></g></svg>
