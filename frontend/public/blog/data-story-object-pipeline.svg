<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="t d"><title id="t">Data story object pipeline</title><desc id="d">Evidence objects feed visual objects, decision objects, and presentation while provenance remains explicit.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7581ad"/></marker></defs><rect width="1600" height="720" fill="#0a0c21"/><g font-family="Segoe UI,Arial,sans-serif"><text x="70" y="78" fill="#58ddff" font-size="18" font-weight="800" letter-spacing="3">DATA STORY PIPELINE</text><text x="70" y="126" fill="#fff" font-size="38" font-weight="800">Each layer remains inspectable—and connected</text><g><rect x="70" y="208" width="330" height="350" rx="22" fill="#13213f" stroke="#43cfff" stroke-width="2"/><text x="100" y="250" fill="#58ddff" font-size="16" font-weight="800">EVIDENCE</text><g fill="#1c2a4e"><rect x="100" y="282" width="270" height="58" rx="10"/><rect x="100" y="354" width="270" height="58" rx="10"/><rect x="100" y="426" width="270" height="58" rx="10"/></g><g fill="#fff" font-size="16"><text x="124" y="318">Dataset · safe sample</text><text x="124" y="390">Table · structured rows</text><text x="124" y="462">Spreadsheet · formulas</text></g><rect x="470" y="208" width="280" height="350" rx="22" fill="#17163f" stroke="#8b6cff" stroke-width="2"/><text x="500" y="250" fill="#b49aff" font-size="16" font-weight="800">VISUAL</text><g fill="#242154"><rect x="500" y="282" width="220" height="82" rx="10"/><rect x="500" y="386" width="220" height="82" rx="10"/></g><text x="524" y="318" fill="#fff" font-size="17">Chart</text><text x="524" y="342" fill="#bfc5db" font-size="13">type · labels · values</text><text x="524" y="422" fill="#fff" font-size="17">KPI</text><text x="524" y="446" fill="#bfc5db" font-size="13">value · target · trend</text><rect x="820" y="208" width="360" height="350" rx="22" fill="#312617" stroke="#ffca69" stroke-width="2"/><text x="850" y="250" fill="#ffcf75" font-size="16" font-weight="800">DECISION</text><g fill="#3a2d1c"><rect x="850" y="282" width="300" height="58" rx="10"/><rect x="850" y="354" width="300" height="58" rx="10"/><rect x="850" y="426" width="300" height="58" rx="10"/></g><g fill="#fff" font-size="16"><text x="874" y="318">Dashboard · operating view</text><text x="874" y="390">Report · interpretation</text><text x="874" y="462">Evaluation · gaps + verdict</text></g><rect x="1250" y="208" width="280" height="350" rx="22" fill="#15342d" stroke="#61e8b8" stroke-width="2"/><text x="1280" y="250" fill="#72f4c6" font-size="16" font-weight="800">PRESENTATION</text><rect x="1280" y="300" width="220" height="184" rx="12" fill="#1b4a3d"/><text x="1308" y="344" fill="#fff" font-size="20" font-weight="800">Slides</text><text x="1308" y="384" fill="#c2e9dc" font-size="14">audience narrative</text><text x="1308" y="412" fill="#c2e9dc" font-size="14">sources retained</text><text x="1308" y="440" fill="#c2e9dc" font-size="14">ready for review</text></g><g stroke="#7581ad" stroke-width="4" marker-end="url(#a)"><path d="M400 383H470"/><path d="M750 383H820"/><path d="M1180 383H1250"/></g><g fill="#9aa5c5" font-size="12" font-weight="800" text-anchor="middle"><text x="435" y="368">DATA</text><text x="785" y="368">REFERENCE</text><text x="1215" y="368">PRESENTATION</text></g><path d="M235 600H1390" stroke="#524b9a" stroke-width="3"/><g fill="#a98bff"><circle cx="235" cy="600" r="7"/><circle cx="610" cy="600" r="7"/><circle cx="1000" cy="600" r="7"/><circle cx="1390" cy="600" r="7"/></g><text x="800" y="648" text-anchor="middle" fill="#c1c7dd" font-size="15"><tspan fill="#a98bff" font-weight="800">PROVENANCE</tspan><tspan> follows the claim from source rows to the slide</tspan></text></g></svg>
