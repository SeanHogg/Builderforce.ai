<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Creation Canvas reuse and versioning controls</title><desc id="d">The product view shows six packs, a framed canvas, checkpoint history, a branch indicator, and per-object merge choices.</desc><rect width="1600" height="900" fill="#090b20"/><g font-family="Segoe UI,Arial,sans-serif"><text x="58" y="68" fill="#a98bff" font-size="18" font-weight="800" letter-spacing="3">REUSE + VERSIONING</text><text x="58" y="116" fill="#fff" font-size="40" font-weight="800">Use the right recovery tool for the right decision</text><rect x="58" y="158" width="410" height="680" rx="24" fill="#141735" stroke="#46517d"/><text x="88" y="202" fill="#fff" font-size="22" font-weight="800">Canvas templates</text><text x="88" y="230" fill="#aab2cd" font-size="14">Marketplace packs</text><g font-size="15"><g fill="#202550"><rect x="88" y="260" width="350" height="68" rx="11"/><rect x="88" y="340" width="350" height="68" rx="11"/><rect x="88" y="420" width="350" height="68" rx="11"/><rect x="88" y="500" width="350" height="68" rx="11"/><rect x="88" y="580" width="350" height="68" rx="11"/><rect x="88" y="660" width="350" height="68" rx="11"/></g><g fill="#fff" font-weight="700"><text x="112" y="289">Campaign studio</text><text x="112" y="369">Product discovery</text><text x="112" y="449">Data story</text><text x="112" y="529">Impromptu stand-up</text><text x="112" y="609">Evermind model lab</text><text x="112" y="689">Executive review</text></g><g fill="#aab2cd" font-size="12"><text x="112" y="311">4 objects · Marketplace template</text><text x="112" y="391">4 objects · Marketplace template</text><text x="112" y="471">4 objects · Marketplace template</text><text x="112" y="551">4 objects · Object pack</text><text x="112" y="631">4 objects · Marketplace template</text><text x="112" y="711">4 objects · Object pack</text></g></g><rect x="504" y="158" width="620" height="680" rx="24" fill="#0d1129" stroke="#3c4675"/><rect x="534" y="190" width="560" height="430" rx="20" fill="#121638" stroke="#8b6cff" stroke-width="3"/><text x="560" y="228" fill="#b49aff" font-size="14" font-weight="800">FRAME · EXECUTIVE REVIEW</text><g><rect x="566" y="270" width="210" height="110" rx="14" fill="#1a1b48" stroke="#8b6cff"/><text x="590" y="305" fill="#fff" font-size="18" font-weight="800">Project context</text><text x="590" y="336" fill="#aeb6d1" font-size="13">Delivery lens</text><rect x="824" y="270" width="238" height="110" rx="14" fill="#142747" stroke="#43cfff"/><text x="848" y="305" fill="#fff" font-size="18" font-weight="800">Portfolio health</text><text x="848" y="336" fill="#aeb6d1" font-size="13">Dashboard · Live</text><rect x="566" y="434" width="210" height="110" rx="14" fill="#16342d" stroke="#61e8b8"/><text x="590" y="469" fill="#fff" font-size="18" font-weight="800">Roadmap</text><text x="590" y="500" fill="#bce8d9" font-size="13">Approved milestones</text><rect x="824" y="434" width="238" height="110" rx="14" fill="#1a1b48" stroke="#8b6cff"/><text x="848" y="469" fill="#fff" font-size="18" font-weight="800">Leadership slides</text><text x="848" y="500" fill="#aeb6d1" font-size="13">Presentation</text></g><path d="M776 325H824M671 380V434M943 380V434" stroke="#7180ad" stroke-width="3"/><rect x="534" y="650" width="560" height="152" rx="16" fill="#141735"/><text x="560" y="684" fill="#9ca7ca" font-size="13" font-weight="800">HISTORY</text><circle cx="580" cy="724" r="7" fill="#72f4c6"/><text x="602" y="730" fill="#fff" font-size="14">Checkpoint · Leadership-approved baseline</text><circle cx="580" cy="762" r="7" fill="#58ddff"/><text x="602" y="768" fill="#fff" font-size="14">Branch · alternate-prioritization</text>
