<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="t d"><title id="t">Design-to-debug object graph</title><desc id="d">Design, implementation, failure evidence, runtime, and delivery remain one typed sequence.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7581ad"/></marker></defs><rect width="1600" height="720" fill="#0a0c21"/><g font-family="Segoe UI,Arial,sans-serif"><text x="70" y="78" fill="#a98bff" font-size="18" font-weight="800" letter-spacing="3">ONE SESSION GRAPH</text><text x="70" y="126" fill="#fff" font-size="38" font-weight="800">From approved intent to verified delivery</text><g fill="#151936" stroke-width="2"><rect x="70" y="230" width="220" height="250" rx="20" stroke="#8b6cff"/><rect x="340" y="230" width="250" height="250" rx="20" stroke="#43cfff"/><rect x="640" y="230" width="250" height="250" rx="20" stroke="#ffca69"/><rect x="940" y="230" width="250" height="250" rx="20" stroke="#61e8b8"/><rect x="1240" y="230" width="290" height="250" rx="20" stroke="#61e8b8"/></g><text x="98" y="272" fill="#b49aff" font-size="16" font-weight="800">DESIGN</text><text x="98" y="316" fill="#fff" font-size="16">Website</text><text x="98" y="350" fill="#fff" font-size="16">WYSIWYG Prototype</text><text x="98" y="384" fill="#fff" font-size="16">Mockup</text><text x="368" y="272" fill="#58ddff" font-size="16" font-weight="800">IMPLEMENTATION</text><text x="368" y="316" fill="#fff" font-size="16">Repository + branch</text><text x="368" y="350" fill="#fff" font-size="16">Editor selection</text><text x="368" y="384" fill="#fff" font-size="16">Code workspace</text><text x="668" y="272" fill="#ffcf75" font-size="16" font-weight="800">FAILURE EVIDENCE</text><text x="668" y="316" fill="#fff" font-size="16">Diagnostics</text><text x="668" y="350" fill="#fff" font-size="16">Terminal output</text><text x="668" y="384" fill="#fff" font-size="16">Acceptance gaps</text><text x="968" y="272" fill="#72f4c6" font-size="16" font-weight="800">RUNNING RESULT</text><text x="968" y="316" fill="#fff" font-size="16">Local service</text><text x="968" y="350" fill="#fff" font-size="16">Browser preview</text><text x="968" y="384" fill="#fff" font-size="16">Viewport</text><text x="1268" y="272" fill="#72f4c6" font-size="16" font-weight="800">DELIVERY</text><text x="1268" y="316" fill="#fff" font-size="16">Project Task</text><text x="1268" y="350" fill="#fff" font-size="16">Assigned Agent</text><text x="1268" y="384" fill="#fff" font-size="16">Approval policy</text><g stroke="#7581ad" stroke-width="4" marker-end="url(#a)"><path d="M290 355H340"/><path d="M590 355H640"/><path d="M890 355H940"/><path d="M1190 355H1240"/></g><g fill="#9aa5c5" font-size="11" font-weight="800" text-anchor="middle"><text x="315" y="338">REFERENCE</text><text x="615" y="338">REFERENCE</text><text x="915" y="338">CONTROL</text><text x="1215" y="338">DELIVERY</text></g><rect x="70" y="540" width="1460" height="94" rx="16" fill="#141735"/><text x="100" y="578" fill="#9da7c8" font-size="13" font-weight="800">SCOPED BRAIN QUESTION</text><text x="100" y="608" fill="#fff" font-size="16">“Does this implementation satisfy the selected mobile concept, and what blocks the preview?”</text></g></svg>
