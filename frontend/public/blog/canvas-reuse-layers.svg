<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="t d"><title id="t">Five layers of Creation Canvas reuse</title><desc id="d">Packs, frames, checkpoints, branches, and merge choices each preserve a different unit of work.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7581ad"/></marker></defs><rect width="1600" height="720" fill="#0a0c21"/><g font-family="Segoe UI,Arial,sans-serif"><text x="70" y="78" fill="#a98bff" font-size="18" font-weight="800" letter-spacing="3">REUSE LAYERS</text><text x="70" y="126" fill="#fff" font-size="38" font-weight="800">Each mechanism preserves a different unit of creation</text><g><rect x="70" y="236" width="250" height="280" rx="22" fill="#17163f" stroke="#8b6cff" stroke-width="2"/><text x="100" y="280" fill="#b49aff" font-size="19" font-weight="800">PACK</text><text x="100" y="326" fill="#fff" font-size="16">registered objects</text><text x="100" y="360" fill="#fff" font-size="16">starter positions</text><text x="100" y="394" fill="#fff" font-size="16">starter connections</text><text x="100" y="468" fill="#9da7c8" font-size="13">Start a working system</text><rect x="370" y="236" width="250" height="280" rx="22" fill="#13213f" stroke="#43cfff" stroke-width="2"/><text x="400" y="280" fill="#58ddff" font-size="19" font-weight="800">FRAME</text><text x="400" y="326" fill="#fff" font-size="16">purpose</text><text x="400" y="360" fill="#fff" font-size="16">color + border</text><text x="400" y="394" fill="#fff" font-size="16">reusable arrangement</text><text x="400" y="468" fill="#9da7c8" font-size="13">Reuse a visual area</text><rect x="670" y="236" width="250" height="280" rx="22" fill="#312617" stroke="#ffca69" stroke-width="2"/><text x="700" y="280" fill="#ffcf75" font-size="19" font-weight="800">CHECKPOINT</text><text x="700" y="326" fill="#fff" font-size="16">named server state</text><text x="700" y="360" fill="#fff" font-size="16">revision snapshot</text><text x="700" y="394" fill="#fff" font-size="16">meaningful landmark</text><text x="700" y="468" fill="#d8c8aa" font-size="13">Preserve an agreed state</text><rect x="970" y="236" width="250" height="280" rx="22" fill="#13213f" stroke="#43cfff" stroke-width="2"/><text x="1000" y="280" fill="#58ddff" font-size="19" font-weight="800">BRANCH</text><text x="1000" y="326" fill="#fff" font-size="16">derived Session</text><text x="1000" y="360" fill="#fff" font-size="16">independent changes</text><text x="1000" y="394" fill="#fff" font-size="16">parent preserved</text><text x="1000" y="468" fill="#9da7c8" font-size="13">Explore independently</text><rect x="1270" y="236" width="260" height="280" rx="22" fill="#15342d" stroke="#61e8b8" stroke-width="2"/><text x="1300" y="280" fill="#72f4c6" font-size="19" font-weight="800">MERGE</text><text x="1300" y="326" fill="#fff" font-size="16">branch or parent</text><text x="1300" y="360" fill="#fff" font-size="16">per matching object</text><text x="1300" y="394" fill="#fff" font-size="16">accept new objects</text><text x="1300" y="468" fill="#bce8d9" font-size="13">Make an explicit decision</text></g><g stroke="#7581ad" stroke-width="4" marker-end="url(#a)"><path d="M320 376H370"/><path d="M620 376H670"/><path d="M920 376H970"/><path d="M1220 376H1270"/></g><rect x="70" y="570" width="1460" height="76" rx="16" fill="#141735"/><text x="800" y="616" text-anchor="middle" fill="#c4cada" font-size="15"><tspan fill="#a98bff" font-weight="800">EXPORT</tspan><tspan> provides a portable recovery path across the complete session</tspan></text></g></svg>
