<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Create locally, claim when durable action is needed</title><desc id="d">A product-faithful Creation Canvas shows local objects, a publish-triggered account gate, and the capabilities gained after claiming the unchanged session.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090b20"/><stop offset="1" stop-color="#17163b"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7380aa"/></marker></defs><rect width="1600" height="900" fill="url(#bg)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="60" y="70" fill="#a98bff" font-size="18" font-weight="800" letter-spacing="3">LOCAL-FIRST CREATION</text><text x="60" y="120" fill="#fff" font-size="40" font-weight="800">The account gate follows the action—not the idea</text><rect x="60" y="170" width="900" height="620" rx="24" fill="#0d1129" stroke="#3d4779" stroke-width="2"/><rect x="60" y="170" width="900" height="66" rx="24" fill="#151a3d"/><text x="92" y="211" fill="#fff" font-size="20" font-weight="700">Untitled local session</text><rect x="672" y="187" width="176" height="32" rx="16" fill="#252052"/><text x="760" y="209" text-anchor="middle" fill="#c7baff" font-size="13" font-weight="700">PRIVATE ON THIS DEVICE</text><rect x="866" y="187" width="70" height="32" rx="8" fill="#6950ed"/><text x="901" y="209" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">Share</text><rect x="78" y="254" width="178" height="510" rx="15" fill="#121735"/><text x="98" y="286" fill="#aeb6d2" font-size="13" font-weight="700">OBJECTS</text><g fill="#1e244c"><rect x="98" y="308" width="138" height="42" rx="8"/><rect x="98" y="360" width="138" height="42" rx="8"/><rect x="98" y="412" width="138" height="42" rx="8"/><rect x="98" y="464" width="138" height="42" rx="8"/></g><g fill="#fff" font-size="14"><text x="116" y="335">⌘ Workflow</text><text x="116" y="387">◎ Website</text><text x="116" y="439">▤ Dataset</text><text x="116" y="491">◇ Note</text></g><g><rect x="300" y="300" width="220" height="126" rx="16" fill="#1b1b4b" stroke="#8b6cff" stroke-width="2"/><text x="326" y="337" fill="#fff" font-size="20" font-weight="800">Campaign workflow</text><text x="326" y="367" fill="#adb5d1" font-size="14">Ready · 4 steps</text><rect x="326" y="389" width="90" height="22" rx="11" fill="#34286d"/><text x="371" y="405" text-anchor="middle" fill="#c9baff" font-size="12">Run</text><rect x="640" y="300" width="220" height="126" rx="16" fill="#132947" stroke="#43cfff" stroke-width="2"/><text x="666" y="337" fill="#fff" font-size="20" font-weight="800">Landing page</text><text x="666" y="367" fill="#adb5d1" font-size="14">Draft · Desktop</text><rect x="666" y="389" width="90" height="22" rx="11" fill="#164c66"/><text x="711" y="405" text-anchor="middle" fill="#68e3ff" font-size="12">Publish</text><rect x="300" y="500" width="220" height="126" rx="16" fill="#132947" stroke="#43cfff"/><text x="326" y="537" fill="#fff" font-size="20" font-weight="800">Customer data</text><text x="326" y="567" fill="#adb5d1" font-size="14">320 rows · 8 columns</text><rect x="640" y="500" width="220" height="126" rx="16" fill="#1b1b4b" stroke="#8b6cff"/><text x="666" y="537" fill="#fff" font-size="20" font-weight="800">Launch notes</text><text x="666" y="567" fill="#adb5d1" font-size="14">Saved locally</text></g><path d="M520 363H640M520 563H640" stroke="#7380aa" stroke-width="3" marker-end="url(#a)"/><text x="580" y="350" text-anchor="middle" fill="#8d99bf" font-size="12">CONTROL</text><text x="580" y="550" text-anchor="middle" fill="#8d99bf" font-size="12">REFERENCE</text>
<rect x="1000" y="216" width="540" height="330" rx="24" fill="#17163f" stroke="#ffca69" stroke-width="2"/><text x="1040" y="266" fill="#fff" font-size="25" font-weight="800">Create an account to publish</text><text x="1040" y="306" fill="#bbc2da" font-size="16">Your Landing page remains saved on this device.</text><text x="1040" y="334" fill="#bbc2da" font-size="16">Create a free account to publish it with:</text><g fill="#fff" font-size="16"><text x="1060" y="380">✓ durable tenant resources</text><text x="1060" y="416">✓ permissions and shared history</text><text x="1060" y="452">✓ governed delivery and status</text></g><rect x="1040" y="478" width="205" height="44" rx="10" fill="#6950ed"/><text x="1143" y="506" text-anchor="middle" fill="#fff" font-size="15" font-weight="800">Create free account</text><rect x="1260" y="478" width="142" height="44" rx="10" fill="#252a4d"/><text x="1331" y="506" text-anchor="middle" fill="#d1d5e7" font-size="15">Keep creating</text><rect x="1000" y="582" width="540" height="208" rx="24" fill="#113229" stroke="#58e0b0"/><text x="1040" y="626" fill="#72f4c6" font-size="18" font-weight="800">AFTER CLAIM</text><g fill="#d8f4e9" font-size="16"><text x="1040" y="666">Same objects + relationships</text><text x="1040" y="700">Workspace roles + invitations</text><text x="1040" y="734">History + checkpoints</text><text x="1040" y="768">Publish · Deliver · Train · Execute</text></g></g></svg>
