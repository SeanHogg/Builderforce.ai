<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="t d"><title id="t">Visual stand-up follow-up loop</title><desc id="d">Members join a ritual, Brain facilitates three questions, evidence stays attached, and approved follow-ups become governed tasks.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7581ad"/></marker></defs><rect width="1600" height="720" fill="#0a0c21"/><g font-family="Segoe UI,Arial,sans-serif"><text x="70" y="78" fill="#a98bff" font-size="18" font-weight="800" letter-spacing="3">RITUAL → ACCOUNTABLE WORK</text><text x="70" y="126" fill="#fff" font-size="38" font-weight="800">The meeting closes only when follow-ups have a path</text><g><rect x="70" y="220" width="300" height="330" rx="22" fill="#17163f" stroke="#8b6cff" stroke-width="2"/><text x="100" y="264" fill="#b49aff" font-size="17" font-weight="800">1 · MEMBERSHIP</text><text x="100" y="314" fill="#fff" font-size="16">Staff Member</text><text x="100" y="352" fill="#fff" font-size="16">Staff Member</text><text x="100" y="390" fill="#58ddff" font-size="16">Delivery Agent</text><text x="100" y="428" fill="#58ddff" font-size="16">Validator Agent</text><text x="100" y="494" fill="#9da7c8" font-size="13">name · role · current focus</text><rect x="440" y="190" width="340" height="390" rx="22" fill="#13213f" stroke="#43cfff" stroke-width="2"/><text x="470" y="234" fill="#58ddff" font-size="17" font-weight="800">2 · BRAIN FACILITATES</text><g fill="#1d2c51"><rect x="470" y="270" width="280" height="62" rx="10"/><rect x="470" y="350" width="280" height="62" rx="10"/><rect x="470" y="430" width="280" height="62" rx="10"/></g><text x="498" y="307" fill="#fff" font-size="17">What progressed?</text><text x="498" y="387" fill="#fff" font-size="17">What is blocked?</text><text x="498" y="467" fill="#fff" font-size="17">What happens next?</text><rect x="850" y="220" width="300" height="330" rx="22" fill="#312617" stroke="#ffca69" stroke-width="2"/><text x="880" y="264" fill="#ffcf75" font-size="17" font-weight="800">3 · ATTACHED EVIDENCE</text><text x="880" y="314" fill="#fff" font-size="16">Project + current Tasks</text><text x="880" y="352" fill="#fff" font-size="16">Diagnostic blocker</text><text x="880" y="390" fill="#fff" font-size="16">Prototype decision</text><text x="880" y="428" fill="#fff" font-size="16">Object comments</text><text x="880" y="494" fill="#d8c8aa" font-size="13">mentions · timer · activity</text><rect x="1220" y="220" width="310" height="330" rx="22" fill="#15342d" stroke="#61e8b8" stroke-width="2"/><text x="1250" y="264" fill="#72f4c6" font-size="17" font-weight="800">4 · GOVERNED FOLLOW-UP</text><text x="1250" y="314" fill="#fff" font-size="16">Task + owner</text><text x="1250" y="352" fill="#fff" font-size="16">acceptance criteria</text><text x="1250" y="390" fill="#fff" font-size="16">approval policy</text><text x="1250" y="428" fill="#fff" font-size="16">Validator proof of Done</text><text x="1250" y="494" fill="#bce8d9" font-size="13">returns status to the Session</text></g><g stroke="#7581ad" stroke-width="4" marker-end="url(#a)"><path d="M370 385H440"/><path d="M780 385H850"/><path d="M1150 385H1220"/></g><g fill="#9aa5c5" font-size="11" font-weight="800" text-anchor="middle"><text x="405" y="370">JOINS</text><text x="815" y="370">REFERENCES</text><text x="1185" y="370">DELIVERS</text></g></g></svg>
