<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">One Creation Session across web and VS Code</title><desc id="desc">Web and VS Code connect to the same session graph, object identities, permissions, presence, comments, and revisioned commands while each surface contributes its native context.</desc><defs><radialGradient id="bg" cx="50%" cy="45%" r="78%"><stop stop-color="#1d2051"/><stop offset=".55" stop-color="#11142f"/><stop offset="1" stop-color="#080a1b"/></radialGradient><linearGradient id="v" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b49aff"/><stop offset="1" stop-color="#6746ef"/></linearGradient><linearGradient id="c" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5ae5ff"/><stop offset="1" stop-color="#387cff"/></linearGradient><linearGradient id="m" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#70f2c3"/><stop offset="1" stop-color="#20b985"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1600" height="900" fill="url(#bg)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="72" y="75" fill="#a98bff" font-size="18" font-weight="700" letter-spacing="3">MULTIPLAYER CREATION</text><text x="72" y="125" fill="#f4f6ff" font-size="42" font-weight="800">Two native surfaces. One durable session.</text><text x="72" y="160" fill="#9ea7c7" font-size="18">Business context and implementation context meet without becoming synchronized copies</text>
<rect x="72" y="220" width="410" height="430" rx="28" fill="#14173a" stroke="#8b6cff" stroke-width="2"/><circle cx="110" cy="258" r="7" fill="#ff6c82"/><circle cx="133" cy="258" r="7" fill="#ffca69"/><circle cx="156" cy="258" r="7" fill="#61e8b8"/><text x="108" y="307" fill="#fff" font-size="26" font-weight="800">Web Creation Canvas</text><text x="108" y="337" fill="#aab2d0" font-size="15">accessible visual workspace</text><g fill="#202552" stroke="#7160bc"><rect x="108" y="378" width="150" height="94" rx="13"/><rect x="278" y="378" width="150" height="94" rx="13"/><rect x="108" y="490" width="150" height="94" rx="13"/><rect x="278" y="490" width="150" height="94" rx="13"/></g><g fill="#fff" font-size="17" font-weight="700"><text x="136" y="418">Customer</text><text x="136" y="441">evidence</text><text x="306" y="418">WYSIWYG</text><text x="306" y="441">prototype</text><text x="136" y="530">Project +</text><text x="136" y="553">delivery lens</text><text x="306" y="530">Activity +</text><text x="306" y="553">inspectors</text></g>
<rect x="1118" y="220" width="410" height="430" rx="28" fill="#101b36" stroke="#47cfff" stroke-width="2"/><circle cx="1156" cy="258" r="7" fill="#ff6c82"/><circle cx="1179" cy="258" r="7" fill="#ffca69"/><circle cx="1202" cy="258" r="7" fill="#61e8b8"/><text x="1154" y="307" fill="#fff" font-size="26" font-weight="800">VS Code editor tab</text><text x="1154" y="337" fill="#aab2d0" font-size="15">native developer context</text><g fill="#172849" stroke="#347ea7"><rect x="1154" y="378" width="150" height="94" rx="13"/><rect x="1324" y="378" width="150" height="94" rx="13"/><rect x="1154" y="490" width="150" height="94" rx="13"/><rect x="1324" y="490" width="150" height="94" rx="13"/></g><g fill="#fff" font-size="17" font-weight="700"><text x="1182" y="418">Files +</text><text x="1182" y="441">selections</text><text x="1352" y="418">Repository +</text><text x="1352" y="441">branch</text><text x="1182" y="530">Diagnostics +</text><text x="1182" y="553">terminal</text><text x="1352" y="530">Local service +</text><text x="1352" y="553">preview</text></g>
<g filter="url(#g)"><circle cx="800" cy="432" r="204" fill="#121642" stroke="#7566d8" stroke-width="3"/><circle cx="800" cy="432" r="144" fill="#1d1954" stroke="#4ccfff" stroke-width="2"/><circle cx="800" cy="432" r="76" fill="url(#v)"/><text x="800" y="424" text-anchor="middle" fill="#fff" font-size="25" font-weight="900">SESSION</text><text x="800" y="456" text-anchor="middle" fill="#ebe8ff" font-size="16">one graph</text></g><g fill="#c4cae0" font-size="15" font-weight="700" text-anchor="middle"><text x="800" y="252">OBJECT IDENTITIES</text><text x="800" y="617">REVISIONED COMMANDS</text><text x="635" y="350" transform="rotate(-48 635 350)">PERMISSIONS</text><text x="965" y="350" transform="rotate(48 965 350)">PRESENCE</text><text x="637" y="534" transform="rotate(48 637 534)">COMMENTS</text><text x="963" y="534" transform="rotate(-48 963 534)">ACTIVITY</text></g><path d="M482 432H592M1008 432H1118" stroke="#8b78ef" stroke-width="5"/><circle cx="552" cy="432" r="9" fill="#a98bff"/><circle cx="1048" cy="432" r="9" fill="#4cd9ff"/>
<rect x="72" y="704" width="1456" height="112" rx="22" fill="#121735" stroke="#303968"/><g text-anchor="middle"><text x="266" y="748" fill="#a98bff" font-size="16" font-weight="800">PERSONAL VIEWPORTS</text><text x="266" y="778" fill="#aab2d0" font-size="14">move freely · follow deliberately</text><text x="605" y="748" fill="#58ddff" font-size="16" font-weight="800">OBJECT COMMENTS</text><text x="605" y="778" fill="#aab2d0" font-size="14">context stays attached</text><text x="944" y="748" fill="#72f4c6" font-size="16" font-weight="800">ROLE-BASED ACCESS</text><text x="944" y="778" fill="#aab2d0" font-size="14">Viewer → Owner</text><text x="1283" y="748" fill="#ffca69" font-size="16" font-weight="800">BRANCH + CHECKPOINT</text><text x="1283" y="778" fill="#aab2d0" font-size="14">safe object-by-object merge</text></g></g></svg>
