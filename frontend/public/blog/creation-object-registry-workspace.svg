<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Creation Object registry in the product</title><desc id="d">The palette shows ten groups, the canvas shows representative registered objects, and the inspector shows declared actions, fields, capabilities, and semantic edge kinds.</desc><rect width="1600" height="900" fill="#090b20"/><g font-family="Segoe UI,Arial,sans-serif"><text x="58" y="68" fill="#a98bff" font-size="18" font-weight="800" letter-spacing="3">48 REGISTERED OBJECT KINDS</text><text x="58" y="116" fill="#fff" font-size="40" font-weight="800">One contract behind the palette, canvas, inspector, and Brain</text><rect x="58" y="158" width="280" height="680" rx="24" fill="#141735"/><text x="88" y="202" fill="#fff" font-size="22" font-weight="800">Objects</text><g font-size="14"><g fill="#202550"><rect x="82" y="228" width="232" height="46" rx="9"/><rect x="82" y="282" width="232" height="46" rx="9"/><rect x="82" y="336" width="232" height="46" rx="9"/><rect x="82" y="390" width="232" height="46" rx="9"/><rect x="82" y="444" width="232" height="46" rx="9"/><rect x="82" y="498" width="232" height="46" rx="9"/><rect x="82" y="552" width="232" height="46" rx="9"/><rect x="82" y="606" width="232" height="46" rx="9"/><rect x="82" y="660" width="232" height="46" rx="9"/><rect x="82" y="714" width="232" height="46" rx="9"/></g><g fill="#fff" font-weight="700"><text x="104" y="257">⌘ Build · 13</text><text x="104" y="311">▤ Data · 4</text><text x="104" y="365">◇ Knowledge · 5</text><text x="104" y="419">▥ Insights · 6</text><text x="104" y="473">✓ Work · 7</text><text x="104" y="527">● People · 4</text><text x="104" y="581">✦ Agents · 2</text><text x="104" y="635">◉ Models · 2</text><text x="104" y="689">□ Collaborate · 4</text><text x="104" y="743">⌘ Integrations · 1</text></g></g><text x="88" y="800" fill="#8f9abc" font-size="12">Groups collapse and persist locally</text>
