<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">From customer evidence to ten accountable product concepts</title>
  <desc id="desc">Feedback sources are profiled and synthesized into a cited feature summary, expanded into ten mockups, evaluated against project reality, and delivered as governed tasks.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090b20"/><stop offset=".55" stop-color="#16153b"/><stop offset="1" stop-color="#0a1024"/></linearGradient><linearGradient id="v" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b49aff"/><stop offset="1" stop-color="#6a4df0"/></linearGradient><linearGradient id="c" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#55e0ff"/><stop offset="1" stop-color="#417cff"/></linearGradient><linearGradient id="m" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#72f4c6"/><stop offset="1" stop-color="#25b985"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7481ae"/></marker></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="72" y="75" fill="#a98bff" font-size="18" font-weight="700" letter-spacing="3">PRODUCT DISCOVERY PACK</text><text x="72" y="125" fill="#f4f6ff" font-size="42" font-weight="800">Ten concepts, every one connected to evidence</text><text x="72" y="160" fill="#9ea7c7" font-size="18">The canvas preserves provenance from raw feedback through approval and delivery</text>
  <g fill="none" stroke="#65719c" stroke-width="3" marker-end="url(#a)"><path d="M315 425H390"/><path d="M660 425H738"/><path d="M1068 425H1142"/><path d="M1370 425H1450"/></g>
  <g><rect x="72" y="236" width="243" height="378" rx="24" fill="#121735" stroke="#46538a" stroke-width="2"/><text x="102" y="278" fill="#fff" font-size="23" font-weight="800">1 · Evidence</text><g fill="#1c2349" stroke="#48578a"><rect x="102" y="310" width="183" height="58" rx="10"/><rect x="102" y="380" width="183" height="58" rx="10"/><rect x="102" y="450" width="183" height="58" rx="10"/></g><text x="126" y="346" fill="#c6cbe0" font-size="16">CSV / TSV feedback</text><text x="126" y="416" fill="#c6cbe0" font-size="16">Reports + dashboards</text><text x="126" y="486" fill="#c6cbe0" font-size="16">MCP sources</text><text x="102" y="551" fill="#58ddff" font-size="15" font-weight="700">PROFILE</text><text x="102" y="578" fill="#9ea7c7" font-size="14">themes · segments · frequency</text></g>
  <g><rect x="390" y="236" width="270" height="378" rx="24" fill="#17163f" stroke="#8b6cff" stroke-width="2"/><text x="420" y="278" fill="#fff" font-size="23" font-weight="800">2 · Feature Summary</text><g fill="#a98bff"><circle cx="424" cy="327" r="5"/><circle cx="424" cy="375" r="5"/><circle cx="424" cy="423" r="5"/><circle cx="424" cy="471" r="5"/><circle cx="424" cy="519" r="5"/></g><g fill="#c6cbe0" font-size="15"><text x="444" y="333">customer problem</text><text x="444" y="381">representative evidence</text><text x="444" y="429">frequency + segments</text><text x="444" y="477">outcome + constraints</text><text x="444" y="525">confidence + freshness</text></g><rect x="420" y="558" width="210" height="28" rx="14" fill="#28205c"/><text x="525" y="578" text-anchor="middle" fill="#c9baff" font-size="13" font-weight="700">CITATIONS RETAINED</text></g>
  <g><rect x="738" y="210" width="330" height="430" rx="26" fill="#111733" stroke="#43cfff" stroke-width="2"/><text x="768" y="252" fill="#fff" font-size="23" font-weight="800">3 · Mockup Set</text><text x="768" y="281" fill="#8fa1c8" font-size="14">Ten individually reviewable concepts</text><g transform="translate(768 312)">
    <g fill="#1c2752" stroke="#4f8bff"><rect width="80" height="100" rx="10"/><rect x="94" width="80" height="100" rx="10"/><rect x="188" width="80" height="100" rx="10"/><rect y="114" width="80" height="100" rx="10"/><rect x="94" y="114" width="80" height="100" rx="10"/><rect x="188" y="114" width="80" height="100" rx="10"/><rect y="228" width="80" height="100" rx="10"/><rect x="94" y="228" width="80" height="100" rx="10"/><rect x="188" y="228" width="80" height="100" rx="10"/><rect x="94" y="342" width="80" height="58" rx="10"/></g><g fill="#57ddff"><circle cx="40" cy="38" r="12"/><circle cx="134" cy="38" r="12"/><circle cx="228" cy="38" r="12"/><circle cx="40" cy="152" r="12"/><circle cx="134" cy="152" r="12"/><circle cx="228" cy="152" r="12"/><circle cx="40" cy="266" r="12"/><circle cx="134" cy="266" r="12"/><circle cx="228" cy="266" r="12"/><circle cx="134" cy="371" r="12"/></g><g fill="#fff" font-size="12" font-weight="800" text-anchor="middle"><text x="40" y="42">01</text><text x="134" y="42">02</text><text x="228" y="42">03</text><text x="40" y="156">04</text><text x="134" y="156">05</text><text x="228" y="156">06</text><text x="40" y="270">07</text><text x="134" y="270">08</text><text x="228" y="270">09</text><text x="134" y="375">10</text></g></g></g>
  <g><rect x="1142" y="236" width="228" height="378" rx="24" fill="#121735" stroke="#ffca69" stroke-width="2"/><text x="1172" y="278" fill="#fff" font-size="23" font-weight="800">4 · Evaluate</text><g fill="#1c2349"><rect x="1172" y="312" width="168" height="62" rx="10"/><rect x="1172" y="390" width="168" height="62" rx="10"/><rect x="1172" y="468" width="168" height="62" rx="10"/></g><text x="1192" y="338" fill="#ffcf75" font-size="14" font-weight="700">CUSTOMER IMPACT</text><text x="1192" y="358" fill="#9ea7c7" font-size="13">verified problem</text><text x="1192" y="416" fill="#ffcf75" font-size="14" font-weight="700">OVERLAP</text><text x="1192" y="436" fill="#9ea7c7" font-size="13">already planned</text><text x="1192" y="494" fill="#ffcf75" font-size="14" font-weight="700">DELIVERY RISK</text><text x="1192" y="514" fill="#9ea7c7" font-size="13">dependencies</text><text x="1172" y="574" fill="#9ea7c7" font-size="14">Roadmap + Slides</text></g>
  <g><rect x="1450" y="306" width="98" height="238" rx="22" fill="#163529" stroke="#61e8b8" stroke-width="2"/><circle cx="1499" cy="360" r="22" fill="url(#m)"/><path d="m1488 360 8 8 16-18" fill="none" stroke="#082419" stroke-width="5"/><text x="1499" y="413" text-anchor="middle" fill="#fff" font-size="17" font-weight="800">Task</text><text x="1499" y="440" text-anchor="middle" fill="#fff" font-size="17" font-weight="800">+ Agent</text><text x="1499" y="486" text-anchor="middle" fill="#8eddbf" font-size="12">approval</text><text x="1499" y="505" text-anchor="middle" fill="#8eddbf" font-size="12">policy</text></g>
  <rect x="72" y="700" width="1456" height="116" rx="22" fill="#121735" stroke="#303968"/><text x="106" y="744" fill="#a98bff" font-size="17" font-weight="800">PROVENANCE THREAD</text><path d="M298 772H1390" stroke="#5e6b95" stroke-width="3"/><g fill="#a98bff"><circle cx="298" cy="772" r="8"/><circle cx="525" cy="772" r="8"/><circle cx="903" cy="772" r="8"/><circle cx="1256" cy="772" r="8"/><circle cx="1390" cy="772" r="8"/></g><g fill="#aab2d0" font-size="14" text-anchor="middle"><text x="298" y="800">source comment</text><text x="525" y="800">cited need</text><text x="903" y="800">visual concept</text><text x="1256" y="800">review decision</text><text x="1390" y="800">delivered work</text></g></g></svg>
