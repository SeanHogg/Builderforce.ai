<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Project comparison becomes an evidence-backed roadmap</title><desc id="desc">Live project lenses feed an inspectable Brain comparison across seven dimensions, then generate audience-specific executive or sales roadmaps and accountable tasks.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090b20"/><stop offset=".55" stop-color="#17163b"/><stop offset="1" stop-color="#0a1024"/></linearGradient><linearGradient id="v" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b49aff"/><stop offset="1" stop-color="#6948ef"/></linearGradient><linearGradient id="c" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#58e1ff"/><stop offset="1" stop-color="#397cff"/></linearGradient><linearGradient id="m" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#72f4c6"/><stop offset="1" stop-color="#22b986"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7683ad"/></marker></defs><rect width="1600" height="900" fill="url(#bg)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="72" y="75" fill="#a98bff" font-size="18" font-weight="700" letter-spacing="3">PORTFOLIO DECISION SYSTEM</text><text x="72" y="125" fill="#f4f6ff" font-size="42" font-weight="800">From live project facts to an accountable roadmap</text><text x="72" y="160" fill="#9ea7c7" font-size="18">Every recommendation keeps its source, freshness, audience, and delivery path</text>
<g fill="none" stroke="#65719c" stroke-width="3" marker-end="url(#a)"><path d="M372 434H468"/><path d="M960 434H1052"/><path d="M1330 434H1430"/></g><g><rect x="72" y="225" width="300" height="418" rx="24" fill="#121735" stroke="#49558a" stroke-width="2"/><text x="102" y="267" fill="#fff" font-size="23" font-weight="800">Live Project objects</text><g><rect x="102" y="306" width="240" height="86" rx="14" fill="#211b51" stroke="#8b6cff"/><rect x="102" y="410" width="240" height="86" rx="14" fill="#14274d" stroke="#47cfff"/><rect x="102" y="514" width="240" height="86" rx="14" fill="#16352e" stroke="#61e8b8"/></g><g fill="#fff" font-size="18" font-weight="800"><text x="128" y="339">Project Atlas</text><text x="128" y="443">Project Beacon</text><text x="128" y="547">Project Current</text></g><g fill="#aab2d0" font-size="14"><text x="128" y="368">delivery · metrics · feedback</text><text x="128" y="472">delivery · metrics · feedback</text><text x="128" y="576">delivery · metrics · feedback</text></g><text x="102" y="626" fill="#77dfff" font-size="13" font-weight="700">CANONICAL · PERMISSIONED · FRESH</text></g>
