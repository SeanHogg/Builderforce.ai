<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">A complete live data story on Creation Canvas</title><desc id="d">A canvas interface contains Dataset, Chart, KPI, Dashboard, Report, and Slides objects joined by data, reference, and presentation connections.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7180ad"/></marker></defs><rect width="1600" height="900" fill="#090b20"/><g font-family="Segoe UI,Arial,sans-serif"><text x="58" y="68" fill="#58ddff" font-size="18" font-weight="800" letter-spacing="3">DATA STORY · LIVE OBJECT GRAPH</text><text x="58" y="116" fill="#fff" font-size="40" font-weight="800">The evidence stays connected to the executive slide</text><rect x="58" y="158" width="1484" height="680" rx="24" fill="#0d1129" stroke="#35406e" stroke-width="2"/><rect x="80" y="180" width="190" height="636" rx="16" fill="#141735"/><text x="104" y="218" fill="#9da7c8" font-size="13" font-weight="800">DATA</text><g fill="#202550"><rect x="104" y="242" width="142" height="40" rx="8"/><rect x="104" y="292" width="142" height="40" rx="8"/><rect x="104" y="342" width="142" height="40" rx="8"/><rect x="104" y="392" width="142" height="40" rx="8"/></g><g fill="#fff" font-size="14"><text x="121" y="268">▤ Table</text><text x="121" y="318">▤ Spreadsheet</text><text x="121" y="368">▥ Chart</text><text x="121" y="418">↗ KPI</text></g><text x="104" y="466" fill="#9da7c8" font-size="13" font-weight="800">INSIGHTS</text><g fill="#202550"><rect x="104" y="490" width="142" height="40" rx="8"/><rect x="104" y="540" width="142" height="40" rx="8"/><rect x="104" y="590" width="142" height="40" rx="8"/></g><g fill="#fff" font-size="14"><text x="121" y="516">▥ Dashboard</text><text x="121" y="566">▤ Report</text><text x="121" y="616">✦ Evaluation</text></g><g><rect x="310" y="232" width="260" height="174