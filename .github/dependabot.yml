# Dependabot — automated dependency and action updates.
#
# This repo is NOT a pnpm workspace: each package under api/, frontend/,
# agent-runtime/, packages/*, etc. carries its own manifest + lockfile, so every
# directory has to be listed explicitly (Dependabot resolves one lockfile per
# entry). The `directories:` plural form keeps that to one ecosystem block
# instead of one block per package.
#
# Noise control is deliberate and matters more than freshness here: without
# grouping, ~60 npm directories x weekly minor/patch churn would open dozens of
# PRs a week and train everyone to ignore them. So:
#   - patch + minor are batched into ONE grouped PR per directory
#   - major bumps stay ungrouped (they need a human to read the changelog)
#   - open-pull-requests-limit caps the blast radius per ecosystem
#
# Security advisories are exempt from the schedule and from the PR limit —
# GitHub raises those immediately regardless of what is configured here.
#
# 2026-11-14: the packages/* list was expanded from 3 entries (agent-tools,
# brain-ui, tui) to all of packages/*. Those lockfiles were already scanned for
# the GitHub dependency graph (hence the 776 Dependabot alerts), but with no
# `updates` entry pointing at them there was no PR path to ever fix them —
# vulnerabilities in the uncovered packages could only age. Full coverage is
# the point of the alerts.

version: 2

updates:
  # ---------------------------------------------------------------------------
  # GitHub Actions — the workflows themselves.
  # The repo currently pins actions/checkout@v4 + setup-node@v4 while the sibling
  # builderforce-memory repo is on @v7/@v6; this keeps both from drifting again.
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # No auto-rebase when main moves: every push to main otherwise re-ran CI on every open
    # Dependabot PR. Rebase one on demand with an "@dependabot rebase" comment.
    rebase-strategy: disabled
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: 'ci(deps)'

  # ---------------------------------------------------------------------------
  # npm — the shipped packages. Deliberately NOT every package.json in the tree:
  # frontend/.next is build output, and webdit/* + brain-embedded are not on a
  # release path, so bumping them buys risk without buying anything. Everything
  # else that ships — every packages/* module, the worker, the chrome client —
  # is listed so its lockfile actually gets fix PRs.
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directories:
      - /api
      - /frontend
      - /agent-runtime
      - /worker
      - /clients/vscode
      - /clients/chrome
      - /sdk
      - /studio
      - /studio-embedded
      - /browser-sdk
      - /voice
      - /qa-e2e
      - /docs-site
      - /packages/agent-loop
      - /packages/agent-run
      - /packages/agent-skills
      - /packages/agent-stall
      - /packages/agent-tools
      - /packages/bfi-node
      - /packages/bfi-web
      - /packages/brain-ui
      - /packages/canvas-widget-protocol
      - /packages/cost-levers
      - /packages/creation-canvas-contract
      - /packages/device-auth
      - /packages/difficulty-router
      - /packages/hono-wildcard-path
      - /packages/hs256-jwt
      - /packages/ide-file-contract
      - /packages/ide-templates
      - /packages/interaction-contract
      - /packages/json-schema
      - /packages/kimi-oauth
      - /packages/knowledge-browser
      - /packages/knowledge-client
      - /packages/knowledge-graph-view
      - /packages/learned-routing
      - /packages/local-first
      - /packages/local-inference
      - /packages/model-catalog
      - /packages/model-router
      - /packages/pipeline-route
      - /packages/prefetch
      - /packages/provider-connect
      - /packages/read-through-cache
      - /packages/repo-map
      - /packages/resume-ai
      - /packages/run-context
      - /packages/run-delta
      - /packages/run-guards
      - /packages/run-policy
      - /packages/sarif
      - /packages/score-math
      - /packages/secret-redaction
      - /packages/session-introspection
      - /packages/spend-contract
      - /packages/tool-output-policy
      - /packages/tui
      - /packages/voice-provenance
      - /packages/workload
      - /packages/workspace-path
      - /packages/write-outbox
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # No auto-rebase when main moves: every push to main otherwise re-ran CI on every open
    # Dependabot PR. Rebase one on demand with an "@dependabot rebase" comment.
    rebase-strategy: disabled
    groups:
      # One PR per directory for the low-risk churn.
      safe-updates:
        patterns: ['*']
        update-types: [minor, patch]
      # Type definitions move constantly and independently of runtime behaviour;
      # keeping them in their own group stops a @types bump from being buried in
      # a diff that also moves a framework.
      types:
        patterns: ['@types/*']
    ignore:
      # TypeScript is pinned across every package: `tsc` is the native TypeScript 7
      # compiler everywhere (`typescript` itself, or the `typescript-7` alias in the
      # packages whose tools need the JS compiler API, where `typescript` is aliased to
      # `@typescript/typescript6`). A Dependabot bump in ONE directory desynchronises
      # the compiler across the monorepo, and a bump of the `typescript` alias to 7.x
      # would remove the JS API those tools load. Upgrade it deliberately, everywhere
      # at once, by hand.
      - dependency-name: typescript
      - dependency-name: typescript-7
      - dependency-name: '@typescript/typescript6'
      # Node type defs must track the engines field, not the newest major.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # `@types/vscode` must not exceed `engines.vscode` (vsce refuses to package):
      # it moves only together with the engines floor, by hand.
      - dependency-name: '@types/vscode'
      # docs-site is on Astro 5; Starlight 0.35+ requires a newer Astro (peer
      # ERESOLVE breaks `npm ci`). Move Starlight only together with Astro, by hand.
      - dependency-name: '@astrojs/starlight'
        update-types: [version-update:semver-minor, version-update:semver-major]
      # frontend pins next-on-pages exactly and carries a version-keyed pnpm patch
      # (frontend/patches/): a bump fails install on the unused patch. Move it by hand.
      - dependency-name: '@cloudflare/next-on-pages'
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(dev-deps)'

  # ---------------------------------------------------------------------------
  # Docker — the agent + QA runner images. These run untrusted-ish agent code
  # with a real shell, so a stale base image is a genuine exposure, not just lag.
  # ---------------------------------------------------------------------------
  - package-ecosystem: docker
    directories:
      - /api/container
      - /api/qa-container
      - /agent-runtime
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # No auto-rebase when main moves: every push to main otherwise re-ran CI on every open
    # Dependabot PR. Rebase one on demand with an "@dependabot rebase" comment.
    rebase-strategy: disabled
    commit-message:
      prefix: 'build(deps)'
