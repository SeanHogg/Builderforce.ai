# Managed by Builderforce.ai — runs a Builderforce agent on this repo,
# on your own GitHub Actions runner.
#
# Started by Builderforce via workflow_dispatch when a task is assigned to a
# GitHub Actions agent. You can also run it by hand from the Actions tab if you
# have an execution id.
#
# No secrets are required. The job requests a short-lived GitHub OIDC token
# (`id-token: write`) scoped to the "builderforce.ai/agent" audience,
# and Builderforce verifies it against GitHub's public keys to confirm which
# repository is asking. Nothing here can be replayed against another service —
# and a token minted by the deploy workflow cannot drive an agent run.
#
# Edit freely — Builderforce only rewrites this file when you re-run
# "Enable GitHub agent runs" from the app.
name: Builderforce Agent

# Carries the execution id into `display_title` on the workflow-runs API, which
# is the ONLY way to correlate a dispatch with the run it produced (the dispatch
# call returns 204 with no run id, and the runs list does not echo inputs). The
# reconcile sweep reads this to tell "still queued" from "never scheduled".
run-name: Builderforce Agent · execution ${{ inputs.execution_id }}

on:
  workflow_dispatch:
    inputs:
      execution_id:
        description: 'Builderforce execution id to run'
        required: true
        type: string
      ref:
        description: 'Branch or SHA to check out (defaults to the repo default branch)'
        required: false
        type: string

# One run per execution, ever. A re-dispatch of the same execution (a retried
# webhook, an impatient click) would otherwise put two agents on the same ticket
# branch, each committing over the other's work. Not cancel-in-progress: the
# first run is the real one and killing it mid-commit is worse than dropping the
# duplicate.
concurrency:
  group: builderforce-agent-${{ inputs.execution_id }}
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    # An agent loop is long: it builds, tests, and iterates. 60 minutes is well
    # past a healthy run and still bounds a wedged one.
    timeout-minutes: 60
    permissions:
      # Read-only: actions/checkout needs only this. The agent's commits, pushes and pull
      # request all go through Builderforce (with the repo's own integration credential),
      # never through this job's GITHUB_TOKEN — so that token is given nothing to write.
      contents: read
      # Required: mints the OIDC token used to authenticate back to Builderforce.
      id-token: write
    steps:
      # fetch-depth: 0 — a shallow clone has no merge-base with the base branch,
      # so `git merge-base`, `git diff main`, and syncing the latest base all
      # break. The container surface learned this the hard way; full history here.
      # persist-credentials: false — the checkout token must not sit in .git/config where the
      # model's shell could read it. Pushes go through the Worker, never through this clone.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Builderforce agent
        # The agent's shell runs as a separate, unprivileged user with a MINIMAL environment: PATH, HOME, locale,
        # CI, proxy/CA settings, npm_config_* and COREPACK_*. It sees none of this step's variables or secrets.
        # To expose a secret your build needs (a private-registry token, say), set it below AND list its name in
        # BUILDERFORCE_SHELL_ENV (comma-separated). Whatever you list, the agent can read and print.
        env:
          BUILDERFORCE_API: https://builderforce.ai
          BUILDERFORCE_EXECUTION_ID: ${{ inputs.execution_id }}
          # BUILDERFORCE_SHELL_ENV: NPM_TOKEN
          # NPM_TOKEN: (its value, from your repository secret store)
        run: |
          set -euo pipefail

          # Short-lived, audience-scoped proof of which repo this is.
          BUILDERFORCE_TOKEN=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=builderforce.ai/agent" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).value))")
          export BUILDERFORCE_TOKEN

          # The agent loop is DOWNLOADED, not inlined in this YAML, on purpose.
          # This file is committed into every tenant repo, so anything written
          # here is frozen at commit time and can only be changed by re-committing
          # to each repo one by one. Keeping the committed surface to "mint a
          # token, fetch the runner, run it" means the loop — new tools, a fixed
          # cancel path, a protocol change — ships centrally and every repo picks
          # it up on its next run. It also keeps the file small enough to actually
          # read and audit, which is the whole point of it being visible.
          curl -sSf "$BUILDERFORCE_API/api/runtime/github-actions/runner.mjs" -o "$RUNNER_TEMP/bf-runner.mjs"
          node "$RUNNER_TEMP/bf-runner.mjs"

      # Runs even when the job is cancelled or times out (the runner's own cleanup is skipped when it is killed
      # outright): end every process the agent's shell user left, drop the checkout's shell-written .git, and give the
      # checkout back to the runner user so the later steps and the job's post-steps never run the agent's files.
      - name: Clean up the agent's shell user
        if: always()
        run: |
          sudo -n pkill -KILL -u bfagent || true
          sudo -n rm -rf "$GITHUB_WORKSPACE/.git" || true
          sudo -n chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true
