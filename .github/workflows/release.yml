name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  NPM_CONFIG_FETCH_RETRIES: "5"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"

jobs:
  # One runner per package, in parallel. They used to run one after another in a
  # single step, so the fifth package waited on four others' type-checks and tests,
  # and one red package stopped every package listed after it from publishing.
  package-npm:
    name: Package ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: browser-sdk
            package: '@seanhogg/builderforce-quality'
          - dir: sdk
            package: '@seanhogg/builderforce-sdk'
          - dir: studio
            package: '@seanhogg/builderforce-studio'
          # `file:../studio` copies studio's BUILT dist at install time, which the serial
          # loop only had because studio happened to be installed (its `prepare` builds
          # it) earlier in the same step. On its own runner it has to be done first.
          - dir: studio-embedded
            package: '@seanhogg/builderforce-studio-embedded'
            builds-first: studio
          - dir: voice
            package: '@seanhogg/builderforce-voice'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.23.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: ./.github/actions/pnpm-store-cache
        with:
          scope: package-npm-${{ matrix.dir }}

      - uses: ./.github/actions/npm-publish-auth
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}

      - name: Build the linked ${{ matrix.builds-first }} package
        if: matrix.builds-first
        working-directory: ${{ matrix.builds-first }}
        run: pnpm install --frozen-lockfile

      - name: Install
        working-directory: ${{ matrix.dir }}
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            npm install --no-audit --no-fund
          fi

      - name: Type-check and test
        working-directory: ${{ matrix.dir }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/run-parallel.sh" "npm run type-check" "npm test"

      - name: Publish if the version is new
        working-directory: ${{ matrix.dir }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/npm-publish-if-new.sh" "${{ matrix.package }}"

  # The agent runtime's typecheck and unit suite each take a full runner: concurrently on
  # one they fight over the same cores and memory. Separate legs, and package-agents
  # waits for both.
  verify-agents:
    name: Verify @seanhogg/builderforce-agents (${{ matrix.script }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        script: [typecheck, 'test:fast']
    defaults:
      run:
        working-directory: agent-runtime
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.23.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: ./.github/actions/pnpm-store-cache
        with:
          scope: package-agents

      - run: pnpm install --frozen-lockfile
      - run: pnpm run ${{ matrix.script }}

  # The on-prem agent CLI every installer (install.sh / install.ps1 / install-cli.sh,
  # the macOS app) fetches from npm. Its own job, not another package-npm leg: it is a
  # pnpm workspace with its own script names and a control-UI build, and a failure here
  # must not hold back the SDK packages above (or the reverse).
  package-agents:
    name: Package @seanhogg/builderforce-agents
    runs-on: ubuntu-latest
    needs: verify-agents
    defaults:
      run:
        working-directory: agent-runtime
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.23.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: ./.github/actions/pnpm-store-cache
        with:
          scope: package-agents

      - uses: ./.github/actions/npm-publish-auth
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}

      - run: pnpm install --frozen-lockfile

      # vendor/ and apps/shared/BuilderForceAgentsKit are gitignored (Docker builds
      # exclude them too), so a fresh checkout here has neither the A2UI renderer
      # sources nor a prebuilt bundle. bundle-a2ui.sh's own documented escape hatch
      # for exactly this environment: skip bundling and ship the CLI without the
      # canvas feature rather than failing the whole package.
      - run: pnpm build && pnpm ui:build
        env:
          BUILDERFORCE_AGENTS_A2UI_SKIP_MISSING: "1"

      # The tarball's entry point must actually start before it reaches every installer.
      - name: Smoke-test the CLI
        run: node builderforce.mjs --version

      # Built above, so skip `prepack` rather than build the same dist twice.
      - name: Publish if the version is new
        run: bash "$GITHUB_WORKSPACE/.github/scripts/npm-publish-if-new.sh" @seanhogg/builderforce-agents --ignore-scripts

  # Marketplace copy lives in distribution/listing.json and is stamped into every
  # channel payload. A listing that contradicts the product is what a buyer reads,
  # so drift fails the release rather than shipping quietly.
  verify-distribution:
    name: Verify distribution payloads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node distribution/build.mjs --check

  # ── VS Code extension → BOTH extension registries ────────────────────────
  # Microsoft's marketplace licence restricts consumption to Microsoft products,
  # so Open VSX is not a duplicate listing — it is the only way the same VSIX
  # reaches Cursor, Windsurf, VSCodium and Gitpod. One package, two publishes.
  #
  # Three jobs so nothing waits on what it does not need: the type-check and the unit
  # suite (verify-extension) run alongside the package-and-activate gate
  # (package-extension), and only the publish waits on all of them.
  verify-extension:
    name: Verify VS Code extension (${{ matrix.script }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        script: [type-check, test]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.23.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: ./.github/actions/pnpm-store-cache
        with:
          scope: publish-extension

      - name: ${{ matrix.script }}
        working-directory: clients/vscode
        env:
          # vitest's default fork inherits Node's default old-space ceiling. The
          # suite OOM'd after 30/31 files with "Ineffective mark-compacts near heap
          # limit" at 4 GiB, then again at 6 GiB — NOT the many source-package
          # aliases (brain-ui, studio, transformers, onnxruntime-web, mermaid,
          # xlsx, …), which was the original theory here, but `harness/scenarios.test.ts`
          # growing heap without bound on its own (confirmed 2026-09-12 — it is the
          # one file that never finishes, at 6 GiB or 10 GiB, at 1 worker or 2; see
          # the Consolidated Gap Register). Raising this ceiling only buys that file
          # more rope before the same crash, so it stays at the API job's proven-safe
          # value rather than chasing it up: `vitest.config.ts`'s `maxWorkers: 2`
          # means 2 concurrent forks can each reserve this much, and this runner has
          # historically been sized for 16 GiB (2 × 6 GiB leaves headroom; 2 × 10 GiB
          # would not — see the removed-then-restored `maxWorkers: 1` experiment in
          # git history for why serializing was tried and reverted). A forked child
          # process inherits NODE_OPTIONS from its own env at spawn, unlike a worker
          # thread, so setting it here reaches vitest's workers too.
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          pnpm install --frozen-lockfile || pnpm install
          npm run ${{ matrix.script }}

  package-extension:
    name: Package VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.23.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: ./.github/actions/pnpm-store-cache
        with:
          scope: publish-extension

      - name: Build and package the VSIX
        working-directory: clients/vscode
        env:
          # `vscode:prepublish` runs tsc and the webview's vite build; same ceiling as
          # the verify legs, which this step used to share a heap setting with.
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          pnpm install --frozen-lockfile || pnpm install
          npx --yes @vscode/vsce package --no-dependencies --out builderforce.vsix

      # The gate that the offline suites structurally CANNOT be: it launches a real
      # VS Code, activates the packaged extension in it, and checks that every declared
      # command is registered, every view resolves and the webview bundle boots and
      # talks back. An activation failure is invisible to `npm test` — the bundle is
      # only ever LOADED by an extension host — and shipped in three releases
      # (2026.7.126 → 2026.8.128) before this existed. It runs AFTER packaging and
      # BEFORE either publish, so a broken build is caught while it is still local.
      #
      # `xvfb-run` because a headless runner has no display; the download is ~320 MB,
      # which is why this is a release-time gate rather than part of `npm test`.
      #
      # The install is cached so the gate does not hinge on reaching Microsoft's update
      # service: with a cached install present, an unreachable service resolves to it
      # instead of failing the release (a fresh runner once died on `connect ETIMEDOUT`
      # before a single test ran). Only the `vscode-*` install folders are cached, never
      # `user-data/` or `extensions/`, so no run inherits another's profile. The key
      # rolls weekly; restore-keys hands a new week last week's install as the fallback,
      # and `runTests.ts` prunes superseded installs so the cache stays one install big.
      - name: Stamp the VS Code test-binary cache week
        id: vscode-test-week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore the cached VS Code test binary
        uses: actions/cache@v6
        with:
          path: clients/vscode/.vscode-test/vscode-*
          key: vscode-test-${{ runner.os }}-${{ steps.vscode-test-week.outputs.week }}
          restore-keys: vscode-test-${{ runner.os }}-

      - name: Verify the extension activates in a real VS Code
        working-directory: clients/vscode
        run: xvfb-run -a npm run test:integration

      - uses: actions/upload-artifact@v4
        with:
          name: builderforce-vsix
          path: clients/vscode/builderforce.vsix
          if-no-files-found: error
          retention-days: 7

  publish-extension:
    name: Publish VS Code extension
    runs-on: ubuntu-latest
    needs: [verify-extension, package-extension]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # The exact VSIX that passed the activation gate, not a rebuild of it.
      - uses: actions/download-artifact@v8
        with:
          name: builderforce-vsix
          path: clients/vscode

      # Publishing is version-gated: re-running the workflow on an unbumped
      # version must be a no-op, not a hard failure, because this job shares a
      # trigger with the deploys below.
      - name: Publish to the Visual Studio Marketplace
        working-directory: clients/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT is not set — skipping Visual Studio Marketplace publish."
            exit 0
          fi
          # Both registries reject a version that already exists. That is the
          # expected outcome of re-running this workflow on an unbumped version,
          # so it must not fail the release.
          npx --yes @vscode/vsce publish --no-dependencies --packagePath builderforce.vsix \
            || echo "::warning::Visual Studio Marketplace publish did not apply (most likely this version is already published)."

      - name: Publish to Open VSX
        working-directory: clients/vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::OVSX_PAT is not set — skipping Open VSX publish."
            exit 0
          fi
          # ovsx exits non-zero when the version already exists; that is the
          # expected outcome of a re-run, not a release failure.
          npx --yes ovsx publish builderforce.vsix -p "$OVSX_PAT" \
            || echo "::warning::Open VSX publish did not apply (most likely this version is already published)."

  # ── GitHub Action → GitHub Marketplace ───────────────────────────────────
  # The action is usable from this repo today
  # (`SeanHogg/Builderforce.ai/actions/dispatch-agent@main`), but GitHub only
  # lists an action whose `action.yml` sits at a repository ROOT. So the
  # marketplace copy is a mirror: this job pushes the action directory to a
  # dedicated repo and tags it, which is what the Marketplace listing tracks.
  # No mirror secret → skipped, not failed; the in-repo action still works.
  publish-action:
    name: Mirror the GitHub Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Push the action to its standalone repository
        env:
          MIRROR_TOKEN: ${{ secrets.ACTION_MIRROR_TOKEN }}
          MIRROR_REPO: ${{ secrets.ACTION_MIRROR_REPO }}
        run: |
          if [ -z "$MIRROR_TOKEN" ] || [ -z "$MIRROR_REPO" ]; then
            echo "::warning::ACTION_MIRROR_TOKEN/ACTION_MIRROR_REPO not set — skipping the GitHub Marketplace mirror."
            exit 0
          fi
          version=$(node -p "require('./package.json').version" 2>/dev/null || echo "")
          [ -n "$version" ] || version=$(date -u +%Y.%m.%d)

          work=$(mktemp -d)
          cp -R actions/dispatch-agent/. "$work"/
          cp LICENSE "$work"/ 2>/dev/null || true
          cd "$work"
          git init -q
          git config user.name "builderforce-release"
          git config user.email "release@builderforce.ai"
          git add -A
          git commit -qm "Builderforce dispatch-agent action $version"
          git remote add origin "https://x-access-token:${MIRROR_TOKEN}@github.com/${MIRROR_REPO}.git"
          # The mirror is a projection of this directory, never a place work
          # happens, so a force push to a fresh history is the correct shape.
          git push -q --force origin HEAD:main
          git tag -f "v${version}"
          git push -q --force origin "v${version}"
          echo "Mirrored dispatch-agent $version to ${MIRROR_REPO}"

  # ── Builderforce as a listed remote MCP server ───────────────────────────
  # `server.json` describes the public /mcp endpoint the API serves. It is
  # published AFTER the API deploy so the registry never advertises an endpoint
  # that isn't live yet. OIDC proves the io.github.SeanHogg/* namespace, so
  # there is no long-lived registry token to hold.
  publish-mcp-registry:
    name: Publish MCP Registry listing
    runs-on: ubuntu-latest
    needs: [deploy-api, verify-distribution]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Verify the endpoint is live before advertising it
        id: verify
        run: |
          # A registry listing pointing at a dead endpoint is worse than no
          # listing: every client that discovers it fails on first connect.
          #
          # The probe is the shape a real client uses — an unauthenticated
          # JSON-RPC POST — and 401 is the correct answer to it: it proves the
          # route is mounted AND that the challenge a client must satisfy is the
          # one server.json documents. Retried because the API deploy this job
          # waits on has only just propagated.
          code=000
          : >body.txt; : >headers.txt; : >curl-error.txt
          for attempt in 1 2 3; do
            code=$(curl -sS -o body.txt -D headers.txt -w '%{http_code}' --max-time 30 \
              -X POST https://api.builderforce.ai/mcp \
              -H 'content-type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' 2>curl-error.txt || true)
            if [ "$code" = "401" ]; then break; fi
            # Edge mitigation is a property of this runner's IP, not of timing.
            # Retrying it just burns 30s to reach the same verdict.
            if grep -qi '^cf-mitigated:' headers.txt; then break; fi
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done

          if [ "$code" = "401" ]; then
            echo "POST /mcp answered 401 — the route is mounted and challenges as server.json documents."
            echo "publish=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=false" >>"$GITHUB_OUTPUT"

          # Whatever went wrong, say what the endpoint ACTUALLY answered. A bare
          # status code cannot distinguish an unmounted route from an edge that
          # never let the request reach the worker, and that distinction is the
          # whole diagnosis.
          echo "::group::What https://api.builderforce.ai/mcp answered"
          echo "status: $code"
          cat curl-error.txt || true
          cat headers.txt || true
          head -c 2000 body.txt || true
          echo
          echo "::endgroup::"

          # Cloudflare mitigating the probe at the EDGE is a different failure
          # from a broken deploy, and a more serious one to find here: the
          # challenge is served to any caller whose IP scores as automated, which
          # is precisely the audience of this listing — Anthropic connectors, AWS,
          # hosted agents, every server-side MCP client. Publishing under that
          # condition advertises a URL that answers interactive-challenge HTML to
          # everyone who discovers it.
          # This branch is BLOCKED, not BROKEN, and the difference decides whether
          # the release goes red. The zone setting behind it needs Cloudflare
          # dashboard access that no credential in this repo carries, so failing
          # here would paint every push to main red for a condition this workflow
          # cannot clear — and a permanently-red release is how a genuine
          # regression in deploy-api or deploy-frontend goes unnoticed. So: warn
          # loudly, refuse to publish, and let the release stand. The step summary
          # keeps it in front of a human on EVERY run rather than only in a log
          # nobody opens once they learn this job is always red.
          #
          # Any OTHER unexpected status still fails hard below — an unmounted route
          # or a 500 IS broken, and nothing external is stopping us from fixing it.
          if grep -qi '^cf-mitigated:' headers.txt; then
            echo "::warning::BLOCKED (not published): Cloudflare served a $code managed challenge for https://api.builderforce.ai/mcp. The Worker is fine; the zone is challenging this runner's datacenter IP. Fix the zone, then re-run. See the job summary."
            {
              echo "### ⚠️ MCP Registry listing NOT published"
              echo
              echo "\`POST https://api.builderforce.ai/mcp\` answered **$code** with a \`cf-mitigated\` managed challenge."
              echo
              echo "**The Worker is fine.** Mitigation is scored on caller IP: the same request answers \`401\` from a"
              echo "laptop and is challenged from this runner's datacenter ASN. That is precisely the audience of this"
              echo "listing — Anthropic connectors, hosted agents, AWS, every server-side MCP client — so publishing"
              echo "would advertise a URL that answers challenge HTML to everyone who discovers it."
              echo
              echo "This does **not** fail the release: the remedy is a Cloudflare zone setting that no credential in"
              echo "this repo can change. It will keep appearing here until someone clears it."
              echo
              echo "Four settings produce this same header, with **different** remedies:"
              echo
              echo "| Cause | Remedy |"
              echo "|---|---|"
              echo "| Bot Fight Mode (free) | Turn it **off** — it runs outside the Ruleset Engine and skip rules have no effect on it |"
              echo "| Super Bot Fight Mode (Pro+) | Skip rule naming the \`http_request_sbfm\` phase |"
              echo "| Security Level \`high\`/\`under_attack\` | Skip the \`securityLevel\` product |"
              echo "| Browser Integrity Check | Skip the \`bic\` product |"
              echo
              echo "\`\`\`"
              echo "node scripts/cloudflare-bot-exception.mjs           # read which one is on"
              echo "node scripts/cloudflare-bot-exception.mjs --apply   # apply the matching remedy"
              echo "\`\`\`"
              echo
              echo "Needs a token scoped to the \`builderforce.ai\` zone with Zone Settings:Edit + WAF:Edit."
              echo "Tracked in \`ROADMAP.md\` → Platform → *Cloudflare serves a managed challenge to every datacenter caller*."
            } >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error::https://api.builderforce.ai/mcp answered $code, expected 401. Not publishing."
          exit 1

      # The verify step now exits 0 on the blocked-by-zone path, so this gate is
      # what actually stops the publish. Without it, "warn instead of fail" would
      # silently become "publish anyway" — the exact outcome the check exists to
      # prevent.
      - name: Publish server.json
        if: steps.verify.outputs.publish == 'true'
        run: |
          name=$(jq -r '.name' server.json)
          version=$(jq -r '.version' server.json)

          # Registry versions are immutable. A release runs on every push to
          # main, so an unchanged manifest is an expected no-op rather than a
          # failed release.
          if curl -fsSG 'https://registry.modelcontextprotocol.io/v0.1/servers' \
            --data-urlencode "search=$name" \
            | jq -e --arg name "$name" --arg version "$version" \
              '.servers[]? | select(.server.name == $name and .server.version == $version)' \
              >/dev/null; then
            echo "$name@$version is already published; skipping."
            exit 0
          fi

          ./mcp-publisher login github-oidc
          # If another run publishes between the lookup and this call, accept
          # only the registry's explicit duplicate-version response. Preserve
          # all other failures.
          set +e
          output=$(./mcp-publisher publish 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            if printf '%s' "$output" | grep -Fq 'invalid version: cannot publish duplicate version'; then
              echo "$name@$version was published concurrently; continuing."
            else
              exit "$status"
            fi
          fi

  # Everything `npm run type-check && npm test` covers, spread over runners that run side
  # by side; the migration and deploy wait on all of them. No secrets: the suite stubs
  # every binding it touches.
  #
  # vitest is sharded because it was the long pole: ~900 files, 226s wall on one runner,
  # and almost all of it module import (477s cumulative) rather than tests (41s), which
  # divides cleanly across machines. The guards are `npm test`'s first half, run once
  # here rather than in front of every shard.
  verify-api:
    name: Verify API (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: type-check, run: npm run type-check }
          - { name: guards, run: npm run check }
          - { name: vitest 1/4, run: npx vitest run --shard=1/4 }
          - { name: vitest 2/4, run: npx vitest run --shard=2/4 }
          - { name: vitest 3/4, run: npx vitest run --shard=3/4 }
          - { name: vitest 4/4, run: npx vitest run --shard=4/4 }
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.23.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: ./.github/actions/pnpm-store-cache
        with:
          scope: deploy-api

      - name: ${{ matrix.name }}
        working-directory: api
        env:
          # tsc's default ~4 GiB heap is no longer enough for api's type graph
          # (drizzle-orm, zod 4, pdf-lib, pptxgenjs, yjs, …); it OOM'd mid mark-compact.
          # run-checks.mjs spawns tsc/tsgo as child node processes, which inherit this.
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          pnpm install --frozen-lockfile
          ${{ matrix.run }}

  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: verify-api
    # Binds the job to the `production` GitHub Environment so a required-reviewer rule
    # (or a wait timer, or a branch restriction) can gate the migration + worker deploy
    # WITHOUT another change to this file. Until protection rules are configured on that
    # environment the job runs exactly as before — GitHub creates it implicitly on first
    # use with no rules, and repository-level secrets stay readable — so this is the
    # enabling half of the gate, and the operator owns the policy half.
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.23.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: ./.github/actions/pnpm-store-cache
        with:
          scope: deploy-api

      # Container image layer cache for `wrangler deploy` — see
      # .github/scripts/docker-with-layer-cache.sh. setup-buildx gives a builder that can
      # read and write the `gha` cache; ghaction-github-runtime exposes the Actions cache
      # credentials to the `run` step below, which a run step does not get on its own.
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3

      # No global Wrangler here: `deploy:worker` runs through `npm run`, which resolves
      # api's own pinned `wrangler` devDependency. A global install was a second,
      # floating copy nothing in this job called.
      - name: Migrate and deploy API
        working-directory: api
        env:
          WRANGLER_DOCKER_BIN: ${{ github.workspace }}/.github/scripts/docker-with-layer-cache.sh
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NEON_TRANSACTIONAL_DATABASE_URL: ${{ secrets.NEON_TRANSACTIONAL_DATABASE_URL }}
          # One per track in api/scripts/lib/migrationTracks.mjs. The apps track is optional:
          # unset, db:migrate skips it and the Worker serves those tables from the primary.
          NEON_APPS_DATABASE_URL: ${{ secrets.NEON_APPS_DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          pnpm install --frozen-lockfile
          npm run db:migrate

          for attempt in 1 2 3; do
            npm run deploy:worker && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 30
          done

      # The published-site Worker (api/wrangler.sites.toml). AFTER the API, in this
      # order, for two reasons: its `API` service binding needs builderforce-api to
      # exist, and on the first rollout the API deploy above is what releases the
      # `*.builderforce.ai/*` route this one claims.
      #
      # Its secrets are synced from GitHub on every deploy rather than set once by
      # hand, so the two Workers cannot drift apart. Only secrets that are actually set
      # are pushed — an absent SITE_VISITOR_SALT leaves visitor dedup off on the sites
      # Worker (it never hashes unsalted) rather than overwriting anything with "".
      # The salt goes to BOTH Workers, because a visitor must fingerprint identically
      # whichever of them counts the request.
      - name: Deploy published-site Worker
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NEON_TRANSACTIONAL_DATABASE_URL: ${{ secrets.NEON_TRANSACTIONAL_DATABASE_URL }}
          NEON_APPS_DATABASE_URL: ${{ secrets.NEON_APPS_DATABASE_URL }}
          BUILDERFORCE_ERROR_API_KEY: ${{ secrets.BUILDERFORCE_ERROR_API_KEY }}
          SITE_VISITOR_SALT: ${{ secrets.SITE_VISITOR_SALT }}
        run: |
          node -e '
            const names = ["NEON_DATABASE_URL", "NEON_TRANSACTIONAL_DATABASE_URL", "NEON_APPS_DATABASE_URL", "BUILDERFORCE_ERROR_API_KEY", "SITE_VISITOR_SALT"];
            const set = Object.fromEntries(names.filter((n) => process.env[n]).map((n) => [n, process.env[n]]));
            require("fs").writeFileSync("sites-secrets.json", JSON.stringify(set));
            console.log("syncing", Object.keys(set).join(", "));
          '
          for attempt in 1 2 3; do
            npm run deploy:sites && break
            if [ "$attempt" -eq 3 ]; then rm -f sites-secrets.json; exit 1; fi
            sleep 30
          done
          npx wrangler secret bulk sites-secrets.json --config wrangler.sites.toml
          if [ -n "$SITE_VISITOR_SALT" ]; then
            printf '%s' "{\"SITE_VISITOR_SALT\":\"$SITE_VISITOR_SALT\"}" > api-salt.json
            npx wrangler secret bulk api-salt.json
            rm -f api-salt.json
          else
            echo "::warning::SITE_VISITOR_SALT is not set — published-site visitors are counted but not deduplicated on the sites Worker."
          fi
          rm -f sites-secrets.json

      - name: Refresh demo accounts
        env:
          DEMO_RESEED_SECRET: ${{ secrets.DEMO_RESEED_SECRET }}
        run: |
          if [ -n "$DEMO_RESEED_SECRET" ]; then
            curl -fsS -X POST "https://api.builderforce.ai/api/demo/reseed" \
              -H "x-demo-reseed-secret: $DEMO_RESEED_SECRET" \
              --max-time 300 \
              || echo "::warning::Demo account reseed failed."
          fi

  # The frontend ships in three jobs so its gates are off the critical path: the build
  # (~7 minutes, the long pole) and the gates (lint, type-check, guards, brain-ui) run
  # side by side, and only the deploy waits for both. Lint and type-check used to run
  # INSIDE `next build`, serially, for ~2 minutes of every release.
  verify-frontend:
    name: Verify frontend (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `next typegen` writes the route types `next build` would have generated into
          # .next/types, which tsconfig includes, so this checks what the build checked.
          - name: type-check
            run: pnpm exec next typegen && npm run type-check
          # The same lint `next build` ran (its directories, its errors-only failure).
          - name: lint
            run: pnpm exec next lint
          # Two light gates, run concurrently by run-parallel.sh:
          #
          # brain-ui's own suite. The package is BUILT (exports → dist, its own
          # lockfile and vitest config), so it is not one of the source-only packages
          # the API suite runs, and it ran there only by a glob accident that failed
          # on a missing `react`. Its devDependencies are installed by
          # ensure-linked-deps from the frontend install, so it runs here.
          #
          # THE WHOLE GUARD CHAIN, not a hand-picked three. `pnpm run check` is the
          # SAME manifest `npm test` runs (scripts/checks.manifest.mjs), so there is one
          # list and adding a guard reaches CI for free. A hand-named subset is how
          # `check:architecture`, `check:design-tokens` and the `'use client'` ratchet
          # once sat red with nothing but a local run ever reading them.
          - name: guards + brain-ui
            run: >-
              bash "$GITHUB_WORKSPACE/.github/scripts/run-parallel.sh"
              "pnpm --dir ../packages/brain-ui run test"
              "pnpm run check"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.23.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: ./.github/actions/pnpm-store-cache
        with:
          scope: deploy-frontend

      - name: ${{ matrix.name }}
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          pnpm install --frozen-lockfile || pnpm install
          ${{ matrix.run }}

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.23.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: ./.github/actions/pnpm-store-cache
        with:
          scope: deploy-frontend

      # Next's persistent build cache (webpack module cache + SWC output). The build is
      # the longest step in the release; with the previous run's cache restored, only
      # modules that changed recompile. Keyed per commit so every run saves its own
      # (cache entries are immutable), and restore-keys falls back to the newest cache
      # built against the same lockfile — a dependency change starts cold, on purpose.
      - name: Restore the Next.js build cache
        uses: actions/cache@v6
        with:
          path: frontend/.next/cache
          key: next-cache-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-cache-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-

      # The linked local packages (`link:../studio`, …) install themselves: each
      # consumer's `postinstall` runs scripts/ensure-linked-deps.mjs, which walks
      # its link targets and installs any whose dependencies are missing. This
      # step used to be a hand-maintained list here, which only this job had —
      # the VS Code job did not, so brain-ui's shipped `.d.ts` type-checked
      # against an unresolved brain-embedded and the publish failed on members
      # that plainly exist.
      - name: Build frontend
        working-directory: frontend
        env:
          # Vercel's artifact collection exceeded Node's default ~4 GiB heap
          # after building the 90-route frontend. The hosted runner has enough
          # memory for a 6 GiB old-space ceiling.
          NODE_OPTIONS: --max-old-space-size=6144
          NEXT_BUILDERFORCE_ERROR_API_KEY: ${{ secrets.BUILDERFORCE_ERROR_API_KEY }}
          # verify-frontend lints and type-checks; see next.config.js.
          NEXT_SKIP_BUILD_CHECKS: '1'
        run: |
          pnpm install --frozen-lockfile || pnpm install
          pnpm run cf-build

      # Exactly what wrangler.toml deploys: the worker (`_worker.js/`) and the static
      # assets beside it. Hidden files included — `.assetsignore` is what keeps the
      # worker bundle from being uploaded as public assets.
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-output
          path: frontend/.vercel/output/static
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy-frontend:
    name: Deploy frontend
    runs-on: ubuntu-latest
    needs: [build-frontend, verify-frontend]
    # Same production gate as deploy-api — see the note there. Gating only the API would
    # let a reviewed backend ship behind an unreviewed frontend.
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Wrangler
        run: npm install --global wrangler

      - uses: actions/download-artifact@v8
        with:
          name: frontend-output
          path: frontend/.vercel/output/static

      - name: Deploy frontend
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: wrangler deploy --no-bundle

  deploy-help:
    name: Deploy help
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          # docs-site is the one npm package here, so setup-node's own npm cache fits.
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install Wrangler
        run: npm install --global wrangler

      - name: Build and deploy docs
        working-directory: docs-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run build
          wrangler pages deploy dist --project-name=builderforce-docs --branch=main
