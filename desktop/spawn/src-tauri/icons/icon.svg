<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Spawn's mark: a lightning bolt on the purple→pink tile the website and the app use.
       The bundle's PNG/ICO/ICNS icons are generated from this file (`tauri icon`). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#tile)"/>
  <path d="M578 132 L262 572 H486 L430 892 L762 424 H536 Z" fill="#ffffff"/>
</svg>
