<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Synapse</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="brain.css" />
    <link rel="stylesheet" href="chat.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <img src="logo.png" alt="" width="32" height="32" />
          <div class="brand-text">
            <strong>Synapse</strong>
            <span data-i18n="brand.sub"></span>
          </div>
        </div>
        <div id="account"></div>

        <nav class="nav" aria-label="Synapse">
          <a href="#/chat" data-nav="chat">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z" /></svg>
            <span data-i18n="nav.chat"></span>
          </a>
          <a href="#/workspaces" data-nav="workspaces">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg>
            <span data-i18n="nav.workspaces"></span>
            <span class="count" id="nav-count" hidden></span>
          </a>
          <a href="#/search" data-nav="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="m16 16 4.5 4.5" /></svg>
            <span data-i18n="nav.search"></span>
          </a>
          <a href="#/activity" data-nav="activity">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4" /></svg>
            <span data-i18n="nav.activity"></span>
          </a>
          <a href="#/teach" data-nav="teach">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" /><circle cx="12" cy="12" r="3" /></svg>
            <span data-i18n="nav.teach"></span>
          </a>
          <a href="#/skills" data-nav="skills">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3 5 13h6l-1 8 8-10h-6z" /></svg>
            <span data-i18n="nav.skills"></span>
          </a>
          <a href="#/runs" data-nav="runs">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
            <span data-i18n="nav.runs"></span>
          </a>
          <a href="#/evermind" data-nav="evermind">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 6 1V5a3 3 0 0 0-3-1zM15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-6 1" /></svg>
            <span data-i18n="nav.evermind"></span>
          </a>
          <a href="#/connect" data-nav="connect">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7V3M15 7V3M7 7h10v4a5 5 0 0 1-10 0zM12 16v5" /></svg>
            <span data-i18n="nav.connect"></span>
          </a>
        </nav>

        <div class="sidebar-foot">
          <a class="update" id="update" href="#" hidden>
            <span id="update-text"></span>
            <strong data-i18n="update.open"></strong>
          </a>
          <div class="status" id="status">
            <span class="dot" id="status-dot"></span>
            <span id="status-text"></span>
          </div>
          <div class="muted small">
            <span data-i18n="status.local"></span> · <span id="version"></span>
          </div>
        </div>
      </aside>

      <main class="content">
        <p class="error" id="error" role="alert" hidden></p>
        <div id="view"></div>
      </main>
    </div>

    <script type="module" src="js/shell.js"></script>
  </body>
</html>
