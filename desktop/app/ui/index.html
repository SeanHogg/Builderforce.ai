<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Synapse</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="brain.css" />
    <link rel="stylesheet" href="chat.css" />
    <link rel="stylesheet" href="nav.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <img src="logo.png" alt="" width="32" height="32" />
          <div class="brand-text">
            <strong>Synapse</strong>
            <span data-i18n="brand.sub"></span>
          </div>
          <button class="icon-btn new-chat" id="new-chat" type="button" data-icon="plus" data-i18n-title="chat.new" data-i18n-aria="chat.new"></button>
        </div>
        <div id="account"></div>

        <nav class="side-chats" id="side-chats" aria-label="Synapse"></nav>

        <div class="sidebar-foot">
          <nav class="nav foot-nav" aria-label="Synapse">
            <a href="#/evermind" data-nav="evermind" data-icon="evermind"><span data-i18n="nav.evermind"></span></a>
            <a href="#/account" data-nav="settings" data-icon="settings"><span data-i18n="nav.settings"></span></a>
          </nav>
          <a class="update" id="update" href="#" hidden>
            <span id="update-text"></span>
            <strong data-i18n="update.open"></strong>
          </a>
          <div class="status" id="status">
            <span class="dot" id="status-dot"></span>
            <span id="status-text"></span>
          </div>
          <div class="muted small">
            <span data-i18n="status.local"></span> · <span id="version"></span>
          </div>
        </div>
      </aside>

      <main class="content">
        <p class="error" id="error" role="alert" hidden></p>
        <div id="view"></div>
      </main>
    </div>

    <script type="module" src="js/shell.js"></script>
  </body>
</html>
