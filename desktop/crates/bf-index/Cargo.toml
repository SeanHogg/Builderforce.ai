[package]
name = "bf-index"
description = "Local code index for Builderforce: tree-sitter chunking, repo map, hybrid keyword + vector search"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["embeddings"]
# Local ONNX embeddings via fastembed. Without it the index is keyword + structure only,
# which is still a complete, working index — vectors are an additional ranking signal.
embeddings = ["dep:fastembed"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
rusqlite.workspace = true
ignore.workspace = true
notify.workspace = true
notify-debouncer-mini.workspace = true
tree-sitter.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-python.workspace = true
tree-sitter-go.workspace = true
tree-sitter-java.workspace = true
fastembed = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
