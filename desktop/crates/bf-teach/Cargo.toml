[package]
name = "bf-teach"
description = "Record a program's UI actions as semantic steps and replay Train Once skills (Windows UI Automation first)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
rand.workspace = true

[dev-dependencies]
serde_json.workspace = true

# Everything that touches the desktop is per-platform. Windows (UI Automation) is the
# first platform; elsewhere the crate builds and reports "not supported yet", so macOS
# and Linux builds of the app stay green.
[target.'cfg(windows)'.dependencies]
uiautomation = "0.25"
rdev = "0.5"
enigo = "0.6"
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
