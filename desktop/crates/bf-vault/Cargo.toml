[package]
name = "bf-vault"
description = "Synapse's secrets in the OS credential store: skill passwords and the builderforce.ai sign-in key"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

# The freedesktop Secret Service over D-Bus (GNOME Keyring, KWallet) — what a Linux
# desktop session offers. Building needs libdbus-1-dev; the release workflow installs it.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
