name = "builderforce-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Neon Postgres — set via: wrangler secret put NEON_DATABASE_URL
# [vars]
# NEON_DATABASE_URL = "postgresql://user:password@host.neon.tech/dbname?sslmode=require"

# SECURITY (H9): session-token secret gating the data routes (projects/files/
# datasets/training/agents). MUST equal the api's JWT_SECRET so worker-verified
# Bearer tokens match api-issued ones. Set via:
#   wrangler secret put JWT_SECRET   (run in worker/, use the SAME value as api/)
# Without it the data routes fail closed (503). See src/lib/auth.ts.

# ---------------------------------------------------------------------------
# Gateway configuration
# ---------------------------------------------------------------------------
# Worker LLM-triggering routes call the centralized Builderforce gateway:
#   POST https://api.builderforce.ai/llm/v1/chat/completions
#
# Keep this as a visible var (not a secret) so local/dev/prod targets are explicit.

[vars]
BUILDERFORCE_API_BASE_URL = "https://api.builderforce.ai"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "builderforce-storage"

# Public CDN (`https://cdn.builderforce.ai`) for session-replay assets (PRD 33 D5,
# 33a S2.2). Bucket `builderforce-cdn` is served on the custom domain
# `cdn.builderforce.ai` by R2 itself — Cloudflare's edge caches it, and serving
# MUST NOT invoke a Worker (kill check: 200, cache-control as below, a
# `cf-cache-status` header, and NO `cf-worker` header).
#
# Custom domain (idempotent; also run by `.github/scripts/cdn-ensure.sh`):
#   wrangler r2 bucket domain add builderforce-cdn --domain cdn.builderforce.ai --zone-id $CLOUDFLARE_ZONE_ID
#
# No-Worker route for `cdn.builderforce.ai/*` — required so the sites Worker's
# greedy `*.builderforce.ai/*` (api/wrangler.sites.toml) does not capture the host.
# Created through the Cloudflare API, not as a [[routes]] entry here (a wrangler
# route always binds THIS Worker and would set `cf-worker`):
#   POST /zones/:zone/workers/routes  { "pattern": "cdn.builderforce.ai/*", "script": null }
#
# Object layout (Cache-Control set on each object at upload by cdn-publish.sh):
#   /replay/v1/loader.js              public, max-age=300
#   /replay/r/recorder.<hash>.js      public, max-age=31536000, immutable
#   /replay/manifest.json             public, max-age=60
[[r2_buckets]]
binding = "CDN"
bucket_name = "builderforce-cdn"

# AUTH_CACHE_KV — the api's cache namespace (api/wrangler.toml), bound here on purpose:
# the worker caches the api's session-introspection verdict in it, and the api's
# revoke path deletes that key, so a revoked session stops here within the L1 TTL.
# Do not unbind to cut KV writes; set CACHE_L2_KV = "false" (same dial as the api).
[[kv_namespaces]]
binding = "AUTH_CACHE_KV"
id = "ce66c3418ad64952b6847227962429d0"

# explicit custom domain for the legacy IDE/data worker
[[routes]]
pattern = "worker.builderforce.ai"
custom_domain = true

# observability settings
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
