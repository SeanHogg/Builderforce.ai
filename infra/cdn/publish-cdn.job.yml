# Drop-in `publish-cdn` job for `.github/workflows/release.yml` (S2.2).
#
# This file is the source of truth for the job because S2 cannot edit
# `.github/workflows/` (other workstreams own that tree). Splice it in:
#   1. Add `replay-sdk` to the `package-npm` matrix:
#        - dir: replay-sdk
#          package: '@seanhogg/builderforce-replay'
#   2. Paste the job below after `package-npm` and before `deploy-api`.
#   3. Add `publish-cdn` to `deploy-api.needs` so the API never ships a
#      ReplayConfigService that points at a missing recorder.
#
# Secrets: the existing CF_API_TOKEN / CF_ACCOUNT_ID. Optional
# CLOUDFLARE_ZONE_ID — cdn-ensure.sh looks the zone up by name when unset.
# The token needs R2 edit + Zone DNS edit + Workers Routes edit.

  publish-cdn:
    name: Publish cdn.builderforce.ai
    runs-on: ubuntu-latest
    needs: [package-npm]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Ensure R2 bucket, custom domain, CORS, no-Worker route
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: bash .github/scripts/cdn-ensure.sh

      - name: Build replay-sdk CDN assets
        working-directory: replay-sdk
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm run size

      - name: Publish assets to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: bash .github/scripts/cdn-publish.sh replay-sdk/dist/assets
