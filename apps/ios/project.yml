name: Builderforce
options:
  bundleIdPrefix: ai.builderforce
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"

packages:
  BuilderforceKit:
    path: ../shared/BuilderforceKit
  Swabble:
    path: ../../agent-runtime/Swabble

schemes:
  Builderforce:
    shared: true
    build:
      targets:
        Builderforce: all
    test:
      targets:
        - BuilderforceTests

targets:
  Builderforce:
    type: application
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Sources
    dependencies:
      - target: BuilderforceShareExtension
        embed: true
      - target: BuilderforceWatchApp
      - package: BuilderforceKit
      - package: BuilderforceKit
        product: BuilderforceChatUI
      - package: BuilderforceKit
        product: BuilderforceProtocol
      - package: Swabble
        product: SwabbleKit
      - sdk: AppIntents.framework
    preBuildScripts:
      - name: SwiftFormat (lint)
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v swiftformat >/dev/null 2>&1; then
            echo "error: swiftformat not found (brew install swiftformat)" >&2
            exit 1
          fi
          swiftformat --lint --config "$SRCROOT/../../agent-runtime/.swiftformat" \
            "$SRCROOT/Sources" "$SRCROOT/ShareExtension" "$SRCROOT/WatchExtension/Sources"
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v swiftlint >/dev/null 2>&1; then
            echo "error: swiftlint not found (brew install swiftlint)" >&2
            exit 1
          fi
          cd "$SRCROOT"
          swiftlint lint --config "$SRCROOT/.swiftlint.yml"
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: Sources/Builderforce.entitlements
        CODE_SIGN_STYLE: "$(BUILDERFORCE_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(BUILDERFORCE_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(BUILDERFORCE_APP_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(BUILDERFORCE_APP_PROFILE)"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_APPINTENTS_METADATA: NO
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Builderforce
        CFBundleIconName: AppIcon
        CFBundleURLTypes:
          - CFBundleURLName: ai.builderforce.ios
            CFBundleURLSchemes:
              - builderforce
        CFBundleShortVersionString: "2026.10.1"
        CFBundleVersion: "202610100"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
          - remote-notification
        NSLocalNetworkUsageDescription: Builderforce discovers and connects to your Builderforce gateway on the local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        NSBonjourServices:
          - _builderforce-gw._tcp
        NSCameraUsageDescription: Builderforce can capture photos or short video clips when requested via the gateway.
        NSLocationWhenInUseUsageDescription: Builderforce uses your location when you allow location sharing.
        NSLocationAlwaysAndWhenInUseUsageDescription: Builderforce can share your location in the background when you enable Always.
        NSMicrophoneUsageDescription: Builderforce uses the microphone for voice wake and to dictate messages to the Brain.
        NSSpeechRecognitionUsageDescription: Builderforce uses speech recognition for voice wake and to turn your dictation into chat messages.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  BuilderforceShareExtension:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ShareExtension
    dependencies:
      - package: BuilderforceKit
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(BUILDERFORCE_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(BUILDERFORCE_DEVELOPMENT_TEAM)"
        CODE_SIGN_ENTITLEMENTS: ShareExtension/BuilderforceShareExtension.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: "$(BUILDERFORCE_SHARE_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(BUILDERFORCE_SHARE_PROFILE)"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Builderforce Share
        CFBundleShortVersionString: "2026.10.1"
        CFBundleVersion: "202610100"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 1

  BuilderforceWatchApp:
    type: application.watchapp2
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchApp
    dependencies:
      - target: BuilderforceWatchExtension
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BUILDERFORCE_WATCH_APP_BUNDLE_ID)"
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: Builderforce
        CFBundleShortVersionString: "2026.10.1"
        CFBundleVersion: "202610100"
        WKCompanionAppBundleIdentifier: "$(BUILDERFORCE_APP_BUNDLE_ID)"
        WKWatchKitApp: true

  BuilderforceWatchExtension:
    type: watchkit2-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchExtension/Sources
    dependencies:
      - sdk: WatchConnectivity.framework
      - sdk: UserNotifications.framework
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BUILDERFORCE_WATCH_EXTENSION_BUNDLE_ID)"
    info:
      path: WatchExtension/Info.plist
      properties:
        CFBundleDisplayName: Builderforce
        CFBundleShortVersionString: "2026.10.1"
        CFBundleVersion: "202610100"
        NSExtension:
          NSExtensionAttributes:
            WKAppBundleIdentifier: "$(BUILDERFORCE_WATCH_APP_BUNDLE_ID)"
          NSExtensionPointIdentifier: com.apple.watchkit

  BuilderforceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Builderforce
      - package: Swabble
        product: SwabbleKit
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.builderforce.ios.tests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Builderforce.app/Builderforce"
        BUNDLE_LOADER: "$(TEST_HOST)"
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: BuilderforceTests
        CFBundleShortVersionString: "2026.10.1"
        CFBundleVersion: "202610100"
